<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050a3a">
<title>Бюджет</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #050a3a;
    --accent: #3b6bff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #fff;
    transition: background-color 1.5s ease;
    overflow-x: hidden;
  }

  /* ---------- floating gradient ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(70px); opacity: .85;
    transition: background-color 1.5s ease;
    will-change: transform;
  }
  .b1 { width: 70vmax; height: 70vmax; top: -30vmax; left: -20vmax; animation: f1 22s ease-in-out infinite alternate; }
  .b2 { width: 55vmax; height: 55vmax; top: 10vmax; right: -25vmax; animation: f2 26s ease-in-out infinite alternate; }
  .b3 { width: 60vmax; height: 60vmax; bottom: -35vmax; left: -10vmax; animation: f3 30s ease-in-out infinite alternate; opacity: .6; }
  .b4 { width: 35vmax; height: 35vmax; top: 30vmax; left: 20vmax; animation: f4 18s ease-in-out infinite alternate; opacity: .5; }
  @keyframes f1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(18vmax, 10vmax) scale(1.15); } }
  @keyframes f2 { 0% { transform: translate(0,0) scale(1.1); } 100% { transform: translate(-20vmax, 14vmax) scale(.9); } }
  @keyframes f3 { 0% { transform: translate(0,0) scale(.95); } 100% { transform: translate(15vmax, -18vmax) scale(1.2); } }
  @keyframes f4 { 0% { transform: translate(0,0); } 100% { transform: translate(-14vmax, -10vmax) scale(1.3); } }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 70%, rgba(0,0,0,.6) 100%);
  }

  /* ---------- layout ---------- */
  .app {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .pill-title {
    background: rgba(255,255,255,.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.9);
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: grid; place-items: center; border: none; color: #fff; cursor: pointer;
  }

  .hero { text-align: center; padding: 54px 0 30px; }
  .hero-label { font-size: 16px; color: rgba(255,255,255,.85); font-weight: 500; }
  .hero-amount {
    font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1.1; margin: 8px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .hero-amount .dec { font-size: 30px; letter-spacing: -0.5px; }
  .hero-amount .cur { font-size: 30px; letter-spacing: 0; margin-left: 4px; opacity: .9; }
  .hero-sub { font-size: 14px; color: rgba(255,255,255,.7); }
  .hero-pill {
    display: inline-block; margin-top: 18px;
    background: rgba(255,255,255,.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 999px; padding: 10px 20px; font-size: 15px; font-weight: 600;
  }

  .actions { display: flex; justify-content: center; gap: 56px; margin: 22px 0 26px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; color: #fff; cursor: pointer; font: inherit; }
  .action .circle {
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(255,255,255,.16); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: grid; place-items: center;
  }
  .action.primary .circle { background: #fff; color: #111; }
  .action span { font-size: 13px; font-weight: 500; }

  /* ---------- glass cards ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .card {
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px; padding: 16px;
  }
  .card .k { font-size: 13px; color: rgba(255,255,255,.7); font-weight: 500; }
  .card .v { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .s { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 2px; }
  .bar { height: 6px; background: rgba(255,255,255,.15); border-radius: 6px; margin-top: 12px; overflow: hidden; }
  .bar > div { height: 100%; background: #fff; border-radius: 6px; transition: width .5s ease, background-color .5s; }

  .activity { display: flex; align-items: flex-end; gap: 8px; height: 70px; margin-top: 14px; }
  .activity .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .activity .stick { width: 100%; max-width: 22px; border-radius: 6px; background: rgba(255,255,255,.22); min-height: 6px; transition: height .5s ease; }
  .activity .stick.today { background: #fff; }
  .activity .stick.over { background: #ffb4a2; }
  .activity .d { font-size: 11px; color: rgba(255,255,255,.55); }
  .activity .d.today { color: #fff; font-weight: 600; }

  /* ---------- transactions ---------- */
  .tx-card { padding: 6px 16px 8px; }
  .tx-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 6px; }
  .tx-head h2 { font-size: 18px; margin: 0; font-weight: 700; }
  .tx-list { list-style: none; margin: 0; padding: 0; }
  .tx { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.08); position: relative; }
  .tx:last-child { border-bottom: none; }
  .tx-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
  .tx-main { flex: 1; min-width: 0; }
  .tx-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-date { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 2px; }
  .tx-amt { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tx-del {
    display: none; margin-left: 8px; border: none; border-radius: 999px; padding: 7px 12px;
    background: #ff5a4e; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tx.open .tx-del { display: block; }
  .empty { text-align: center; color: rgba(255,255,255,.55); font-size: 14px; padding: 26px 0; }
  .see-all { display: block; width: 100%; text-align: center; padding: 12px 0 8px; background: none; border: none; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }

  /* ---------- bottom sheet ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 460px; margin: 0 auto;
    background: #f4f4f7; color: #111;
    border-radius: 28px 28px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 22px);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.3,1);
  }
  .sheet.show { transform: translateY(0); }
  .grip { width: 40px; height: 5px; border-radius: 5px; background: #d0d0d6; margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; text-align: center; }
  .amount-wrap { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 8px 0 18px; }
  .amount-wrap input {
    font: inherit; font-size: 52px; font-weight: 700; letter-spacing: -1.5px; text-align: right;
    width: 190px; border: none; background: transparent; color: #111; outline: none; padding: 0;
  }
  .amount-wrap input::placeholder { color: #c4c4cc; }
  .amount-wrap .cur { font-size: 28px; font-weight: 600; color: #888; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .chip {
    border: none; border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 500;
    background: #fff; color: #333; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.sel { background: #111; color: #fff; }
  .note {
    width: 100%; border: none; border-radius: 14px; background: #fff; padding: 14px 16px;
    font-size: 16px; color: #111; outline: none; margin-bottom: 14px;
  }
  .btn-main {
    width: 100%; border: none; border-radius: 999px; padding: 17px; font-size: 17px; font-weight: 600;
    background: #111; color: #fff; cursor: pointer;
  }
  .btn-main:active, .action:active .circle { transform: scale(.97); }
  .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .set-grid label { font-size: 13px; color: #666; font-weight: 500; }
  .set-grid .note { margin-top: 6px; font-family: inherit; }
</style>
</head>
<body>

<div class="bg">
  <div class="blob b1" id="b1"></div>
  <div class="blob b2" id="b2"></div>
  <div class="blob b3" id="b3"></div>
  <div class="blob b4" id="b4"></div>
</div>

<div class="app">
  <div class="topbar">
    <div class="pill-title">Продукты · на двоих</div>
    <button class="icon-btn" id="settingsBtn" aria-label="Настройки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>

  <section class="hero">
    <div class="hero-label" id="heroLabel">Осталось</div>
    <div class="hero-amount" id="heroAmount">—</div>
    <div class="hero-sub" id="heroSub">—</div>
    <div class="hero-pill" id="heroPill">—</div>
  </section>

  <div class="actions">
    <button class="action primary" id="addBtn">
      <div class="circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <span>Трата</span>
    </button>
    <button class="action" id="historyBtn">
      <div class="circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
      <span>История</span>
    </button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="k">На эту неделю</div>
      <div class="v" id="weekLeft">—</div>
      <div class="s" id="weekSub">—</div>
      <div class="bar"><div id="weekBar" style="width:0%"></div></div>
    </div>
    <div class="card">
      <div class="k">Сумма на день</div>
      <div class="v" id="perDay">—</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px;">
    <div style="display:flex; justify-content:space-between; align-items:baseline;">
      <div class="k">Активность недели</div>
      <div class="s" id="weekRange">—</div>
    </div>
    <div class="activity" id="activity"></div>
  </div>

  <div class="card tx-card" id="txCard">
    <div class="tx-head"><h2>Последние траты</h2></div>
    <ul class="tx-list" id="txList"></ul>
    <button class="see-all" id="seeAll" style="display:none;">Показать все</button>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <h3>Новая трата</h3>
  <div class="amount-wrap">
    <input type="text" id="amountInput" inputmode="decimal" placeholder="0" autocomplete="off">
    <span class="cur">zł</span>
  </div>
  <div class="chips" id="chips"></div>
  <input class="note" id="noteInput" type="text" placeholder="Заметка — например, Biedronka" autocomplete="off">
  <button class="btn-main" id="saveBtn">Добавить</button>
</div>

<div class="sheet" id="setSheet">
  <div class="grip"></div>
  <h3>Настройки бюджета</h3>
  <div class="set-grid">
    <label>Начало<input class="note" type="date" id="sStart"></label>
    <label>Конец<input class="note" type="date" id="sEnd"></label>
    <label>Бюджет, zł<input class="note" type="text" inputmode="decimal" id="sTotal"></label>
    <label>В неделю, zł<input class="note" type="text" inputmode="decimal" id="sWeekly"></label>
  </div>
  <button class="btn-main" id="sSave">Сохранить</button>
</div>

<script>
(function () {
  // ---------- settings ----------
  const KEY = 'plexiqa_budget_expenses_v1';
  const SKEY = 'plexiqa_budget_settings_v1';
  const DAY = 86400000;
  const DEFAULTS = { start: '2026-07-27', end: '2026-08-22', total: 664, weekly: 155 };
  function loadSettings() { try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(SKEY)) || {}); } catch (e) { return Object.assign({}, DEFAULTS); } }
  let S = loadSettings();
  const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  let START, END, TOTAL, WEEKLY;
  function applySettings() { START = parseD(S.start); END = parseD(S.end); TOTAL = +S.total; WEEKLY = +S.weekly; }
  applySettings();

  const CATS = [
    { id: 'food',  name: 'Продукты', color: '#34c759', icon: 'cart' },
    { id: 'meat',  name: 'Мясо',     color: '#ff6b4a', icon: 'cart' },
    { id: 'dairy', name: 'Молочка',  color: '#5ac8fa', icon: 'cart' },
    { id: 'sweet', name: 'Сладкое',  color: '#ff9f0a', icon: 'cart' },
    { id: 'other', name: 'Другое',   color: '#af52de', icon: 'dots' }
  ];
  const ICONS = {
    cart: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',
    dots: '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>'
  };

  // ---------- color palettes: green -> deep blue -> terracotta ----------
  const PAL = {
    green: { bg: '#03231a', b1: '#0f9d6b', b2: '#34d399', b3: '#065f46', b4: '#a7f3d0' },
    blue:  { bg: '#040833', b1: '#1d3cff', b2: '#4f7bff', b3: '#0a1580', b4: '#8fb0ff' },
    terra: { bg: '#2a0e07', b1: '#c4553a', b2: '#e58a62', b3: '#7a2a17', b4: '#f2c2a0' }
  };
  const STOPS = [
    { p: 0.00, pal: PAL.terra },
    { p: 0.22, pal: PAL.terra },
    { p: 0.50, pal: PAL.blue },
    { p: 0.78, pal: PAL.green },
    { p: 1.00, pal: PAL.green }
  ];
  function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function mixHex(a, b, u) {
    const A = hex2rgb(a), B = hex2rgb(b);
    return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * u)).join(',') + ')';
  }
  function paletteAt(t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 0; i < STOPS.length - 1; i++) {
      const s = STOPS[i], e = STOPS[i + 1];
      if (t >= s.p && t <= e.p) {
        const u = e.p === s.p ? 0 : (t - s.p) / (e.p - s.p);
        const out = {};
        for (const k in s.pal) out[k] = mixHex(s.pal[k], e.pal[k], u);
        return out;
      }
    }
    return PAL.green;
  }
  function applyPalette(t) {
    const p = paletteAt(t);
    document.body.style.backgroundColor = p.bg;
    ['b1', 'b2', 'b3', 'b4'].forEach(k => { document.getElementById(k).style.backgroundColor = p[k]; });
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', p.bg);
  }

  // ---------- storage ----------
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
  let items = load();
  let showAll = false;

  // ---------- helpers ----------
  const nf = new Intl.NumberFormat('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = n => nf.format(n);
  const dayOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const ddmm = d => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '');
  const esc = s => { const x = document.createElement('div'); x.textContent = s; return x.innerHTML; };
  const cat = id => CATS.find(c => c.id === id) || CATS[0];

  function heroHTML(n) {
    const neg = n < 0;
    const s = fmt(Math.abs(n));
    const [int, dec] = s.split(',');
    return (neg ? '−' : '') + int + '<span class="dec">,' + dec + '</span><span class="cur">zł</span>';
  }

  // ---------- render ----------
  function render() {
    const today = dayOnly(new Date());
    const dss = Math.round((today - START) / DAY);
    const maxIdx = Math.floor(Math.round((END - START) / DAY) / 7);
    const wIdx = Math.min(maxIdx, Math.max(0, Math.floor(dss / 7)));
    const wStart = new Date(START.getTime() + wIdx * 7 * DAY);
    let wEnd = new Date(wStart.getTime() + 6 * DAY);
    if (wEnd > END) wEnd = new Date(END);

    const from = today < START ? START : today;
    const daysLeft = Math.max(0, Math.round((END - from) / DAY) + 1);
    document.getElementById('heroLabel').textContent = 'Осталось · до ' + END.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

    const spent = items.reduce((s, e) => s + e.amount, 0);
    const left = TOTAL - spent;

    const inWeek = items.filter(e => { const d = dayOnly(new Date(e.date)); return d >= wStart && d <= wEnd; });
    const wSpent = inWeek.reduce((s, e) => s + e.amount, 0);
    const wLeft = WEEKLY - wSpent;

    // hero
    document.getElementById('heroAmount').innerHTML = heroHTML(left);
    document.getElementById('heroSub').textContent = 'Потрачено ' + fmt(spent) + ' из ' + fmt(TOTAL) + ' zł';
    document.getElementById('heroPill').textContent = daysLeft > 0 ? 'Осталось ' + daysLeft + ' дн.' : 'Период завершён';

    // background color by remaining share
    applyPalette(left / TOTAL);

    // week card
    document.getElementById('weekLeft').textContent = fmt(wLeft) + ' zł';
    document.getElementById('weekSub').textContent = 'потрачено ' + fmt(wSpent);
    const pct = Math.min(100, Math.max(0, wSpent / WEEKLY * 100));
    const bar = document.getElementById('weekBar');
    bar.style.width = pct + '%';
    bar.style.backgroundColor = pct >= 100 ? '#ff6b5b' : pct >= 80 ? '#ffc56b' : '#ffffff';

    // per day card
    const perDay = daysLeft > 0 ? left / daysLeft : 0;
    document.getElementById('perDay').textContent = fmt(perDay) + ' zł';
    // activity bars
    document.getElementById('weekRange').textContent = ddmm(wStart) + ' – ' + ddmm(wEnd);
    const dailyBudget = WEEKLY / 7;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(wStart.getTime() + i * DAY);
      if (d > END) break;
      const sum = items.filter(e => dayOnly(new Date(e.date)).getTime() === d.getTime()).reduce((s, e) => s + e.amount, 0);
      days.push({ d, sum });
    }
    const max = Math.max(dailyBudget * 1.5, ...days.map(x => x.sum));
    const act = document.getElementById('activity');
    act.innerHTML = days.map(x => {
      const h = x.sum > 0 ? Math.max(10, x.sum / max * 100) : 8;
      const isToday = x.d.getTime() === today.getTime();
      const cls = 'stick' + (x.sum > dailyBudget * 1.5 ? ' over' : '') + (isToday ? ' today' : '');
      const wd = x.d.toLocaleDateString('ru-RU', { weekday: 'short' }).slice(0, 2);
      return '<div class="col"><div class="' + cls + '" style="height:' + h + '%"></div><div class="d' + (isToday ? ' today' : '') + '">' + wd + '</div></div>';
    }).join('');

    // transactions
    const list = document.getElementById('txList');
    const sorted = [...items].sort((a, b) => new Date(b.date) - new Date(a.date));
    const shown = showAll ? sorted : sorted.slice(0, 6);
    if (!sorted.length) {
      list.innerHTML = '<div class="empty">Пока пусто — нажми «Трата», чтобы добавить первую покупку</div>';
    } else {
      list.innerHTML = shown.map(e => {
        const c = cat(e.cat);
        const d = new Date(e.date);
        const title = e.note ? esc(e.note) : c.name;
        const sub = (e.note ? c.name + ' · ' : '') + d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        return '<li class="tx" data-id="' + e.id + '">' +
          '<div class="tx-ico" style="background:' + c.color + '">' + ICONS[c.icon] + '</div>' +
          '<div class="tx-main"><div class="tx-name">' + title + '</div><div class="tx-date">' + sub + '</div></div>' +
          '<div class="tx-amt">−' + fmt(e.amount) + ' zł</div>' +
          '<button class="tx-del" data-del="' + e.id + '">Удалить</button>' +
          '</li>';
      }).join('');
    }
    const seeAll = document.getElementById('seeAll');
    seeAll.style.display = sorted.length > 6 ? 'block' : 'none';
    seeAll.textContent = showAll ? 'Свернуть' : 'Показать все (' + sorted.length + ')';
  }

  // ---------- interactions ----------
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const amountInput = document.getElementById('amountInput');
  const noteInput = document.getElementById('noteInput');
  let selCat = 'food';

  function renderChips() {
    document.getElementById('chips').innerHTML = CATS.map(c =>
      '<button class="chip' + (c.id === selCat ? ' sel' : '') + '" data-cat="' + c.id + '"><span class="dot" style="background:' + c.color + '"></span>' + c.name + '</button>'
    ).join('');
  }
  document.getElementById('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    selCat = b.dataset.cat; renderChips();
  });

  function openSheet() {
    renderChips();
    overlay.classList.add('show'); sheet.classList.add('show');
    setTimeout(() => amountInput.focus(), 250);
  }
  function closeSheet() {
    overlay.classList.remove('show'); sheet.classList.remove('show');
    amountInput.blur(); noteInput.blur();
  }
  document.getElementById('addBtn').addEventListener('click', openSheet);
  overlay.addEventListener('click', () => { closeSheet(); setSheet.classList.remove('show'); });

  const setSheet = document.getElementById('setSheet');
  document.getElementById('settingsBtn').addEventListener('click', () => {
    document.getElementById('sStart').value = S.start;
    document.getElementById('sEnd').value = S.end;
    document.getElementById('sTotal').value = S.total;
    document.getElementById('sWeekly').value = S.weekly;
    overlay.classList.add('show'); setSheet.classList.add('show');
  });
  document.getElementById('sSave').addEventListener('click', () => {
    const num = id => parseFloat(String(document.getElementById(id).value).replace(',', '.'));
    const st = document.getElementById('sStart').value, en = document.getElementById('sEnd').value;
    const t = num('sTotal'), w = num('sWeekly');
    if (!st || !en || !(t > 0) || !(w > 0) || parseD(en) < parseD(st)) return;
    S = { start: st, end: en, total: t, weekly: w };
    try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {}
    applySettings();
    overlay.classList.remove('show'); setSheet.classList.remove('show');
    render();
  });

  function addExpense() {
    const v = parseFloat(String(amountInput.value).replace(',', '.').replace(/\s/g, ''));
    if (!v || v <= 0) { amountInput.focus(); return; }
    items.push({ id: Date.now(), amount: Math.round(v * 100) / 100, note: noteInput.value.trim(), cat: selCat, date: new Date().toISOString() });
    save(items);
    amountInput.value = ''; noteInput.value = '';
    closeSheet(); render();
  }
  document.getElementById('saveBtn').addEventListener('click', addExpense);
  amountInput.addEventListener('keydown', e => { if (e.key === 'Enter') noteInput.focus(); });
  noteInput.addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });

  document.getElementById('txList').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) {
      items = items.filter(x => String(x.id) !== del.dataset.del);
      save(items); render(); return;
    }
    const row = e.target.closest('.tx'); if (!row) return;
    document.querySelectorAll('.tx.open').forEach(r => { if (r !== row) r.classList.remove('open'); });
    row.classList.toggle('open');
  });

  document.getElementById('seeAll').addEventListener('click', () => { showAll = !showAll; render(); });
  document.getElementById('historyBtn').addEventListener('click', () => {
    showAll = true; render();
    document.getElementById('txCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  render();
})();
</script>
</body>
</html>
