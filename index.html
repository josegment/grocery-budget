<title>Бюджет на продукты</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #FAFAF8;
    --card: #FFFFFF;
    --ink: #1A1D1C;
    --muted: #6E7573;
    --line: #E7EAE6;
    --green: #1E7A4C;
    --green-soft: #E4F1EA;
    --orange: #D97706;
    --red: #DC2626;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    text-transform: lowercase;
    color: var(--muted);
  }

  .hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 18px 18px;
  }
  .hero .big {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    margin: 6px 0 2px;
  }
  .hero .big.over { color: var(--red); }
  .hero .sub { color: var(--muted); font-size: 15px; }
  .hero .stats {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .stat { flex: 1; }
  .stat .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 13px; color: var(--muted); margin-top: 1px; }

  .big-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 2px; }
  .big-row .big { margin: 0; }
  .edit-icon {
    font: inherit;
    font-size: 18px;
    color: var(--muted);
    background: none;
    border: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .edit-icon:active { background: var(--line); color: var(--ink); }
  .budget-edit { margin-top: 12px; }
  .budget-edit .txt {
    width: 100%;
    font: inherit;
    font-size: 22px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--ink);
    min-height: 52px;
  }
  .budget-edit .txt:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }

  .week {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .week .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .week .left-amt { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .week .left-amt.over { color: var(--red); }
  .week .of { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar {
    height: 10px;
    border-radius: 5px;
    background: var(--line);
    margin-top: 12px;
    overflow: hidden;
  }
  .bar > div { height: 100%; border-radius: 5px; width: 0; transition: width .3s ease; }
  .bar .ok { background: var(--green); }
  .bar .warn { background: var(--orange); }
  .bar .bad { background: var(--red); }
  .week .range { font-size: 13px; color: var(--muted); margin-top: 8px; }

  form.add {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .add input.txt {
    display: block;
    box-sizing: border-box;
    width: 100%;
    margin: 0;
    font: inherit;
    font-size: 17px;
    line-height: 1.3;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--ink);
    height: 52px;
    -webkit-appearance: none;
    appearance: none;
  }
  .add input.txt:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }
  .add input#amount { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .add input[type="date"].txt {
    -webkit-appearance: none;
    appearance: none;
    font-size: 17px;
  }
  .add input[type="date"].txt::-webkit-date-and-time-value { text-align: left; }
  .photo-attach {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
  }
  .photo-btn {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    min-height: 52px;
    cursor: pointer;
  }
  .photo-btn:active { opacity: .85; }
  .photo-preview { position: relative; flex-shrink: 0; }
  .photo-preview img { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; display: block; border: 1px solid var(--line); }
  .photo-preview .rm {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    border: 2px solid var(--card);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add button.submit {
    font: inherit;
    font-size: 17px;
    font-weight: 650;
    min-height: 52px;
    border: 0;
    border-radius: 12px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  .add button.submit:active { opacity: .85; }

  .history { display: flex; flex-direction: column; gap: 0; }
  .history .eyebrow { margin: 6px 4px 8px; }

  .period-group { margin-bottom: 8px; }
  .period-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    font: inherit;
    text-align: left;
    color: var(--ink);
  }
  .period-header:active { background: var(--bg); }
  .period-head-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .period-title { font-size: 14px; font-weight: 650; }
  .period-sub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .period-chevron { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .period-body { padding-top: 8px; }
  .period-body[hidden] { display: none; }

  .entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 8px 12px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .entry .thumb {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 9px;
    object-fit: cover;
    background: var(--line);
    border: 0;
    padding: 0;
    cursor: pointer;
    display: block;
  }
  .entry .info { flex: 1; min-width: 0; }
  .entry .amt { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .entry .meta { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .actions { display: flex; flex-shrink: 0; }
  .entry .iconbtn {
    font: inherit;
    font-size: 17px;
    color: var(--muted);
    background: none;
    border: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .entry .edit:active { background: var(--line); color: var(--ink); }
  .entry .del:active { background: var(--line); color: var(--red); }
  .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 18px 0 6px; }

  .entry.editing { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 14px; }
  .entry .edit-fields { display: flex; flex-direction: column; gap: 8px; }
  .entry .edit-fields input {
    display: block;
    box-sizing: border-box;
    width: 100%;
    margin: 0;
    font: inherit;
    font-size: 17px;
    line-height: 1.3;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    height: 48px;
    -webkit-appearance: none;
    appearance: none;
  }
  .entry .edit-fields input:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }
  .entry .edit-fields input.e-amt { font-weight: 650; font-variant-numeric: tabular-nums; }
  .entry .edit-fields input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .entry .edit-photo { display: flex; align-items: center; gap: 10px; }
  .entry .edit-actions { display: flex; gap: 8px; }
  .entry .edit-actions button {
    font: inherit;
    font-size: 16px;
    font-weight: 650;
    min-height: 48px;
    flex: 1;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  .entry .edit-actions .esave { background: var(--ink); color: #fff; }
  .entry .edit-actions .ecancel { background: var(--line); color: var(--ink); }
  .entry .edit-actions button:active { opacity: .85; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal[hidden] { display: none; }
  .modal img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .modal .close {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 0;
    font-size: 22px;
    cursor: pointer;
  }
</style>

<div class="wrap">
  <section class="hero">
    <div class="eyebrow" id="periodEyebrow">Осталось</div>
    <div class="big-row">
      <div class="big" id="totalLeft">—</div>
      <button type="button" class="edit-icon" id="budgetBtn" aria-label="Изменить бюджет">✎</button>
    </div>
    <div class="sub" id="totalSub"></div>
    <div class="budget-edit" id="budgetEdit" hidden>
      <input class="txt" id="budgetInput" type="text" inputmode="text" autocapitalize="off" autocorrect="off" placeholder="+60 добавить или новая сумма" aria-label="Общий бюджет, zł">
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="daysLeft">—</div><div class="l">дней осталось</div></div>
      <div class="stat"><div class="v" id="perDay">—</div><div class="l">в день в среднем</div></div>
    </div>
  </section>

  <section class="week">
    <div class="eyebrow" id="weekTitle">Эта неделя</div>
    <div class="row" style="margin-top:6px">
      <div class="left-amt" id="weekLeft">—</div>
      <div class="of" id="weekOf">из 155 zł</div>
    </div>
    <div class="bar"><div id="weekBar" class="ok"></div></div>
    <div class="range" id="weekRange"></div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <input class="txt" id="entryDate" type="date" aria-label="Дата траты">
    <input class="txt" id="amount" type="text" inputmode="decimal" placeholder="Сумма, zł" aria-label="Сумма в злотых">
    <input class="txt" id="note" type="text" placeholder="Заметка (необязательно)" aria-label="Заметка" maxlength="80">
    <div class="photo-attach">
      <button type="button" class="photo-btn" id="addPhotoBtn">📷 Добавить фото</button>
      <div class="photo-preview" id="addPhotoPreview" hidden>
        <img id="addPhotoImg" alt="Предпросмотр фото">
        <button type="button" class="rm" id="addPhotoRemove" aria-label="Убрать фото">✕</button>
      </div>
    </div>
    <input type="file" id="addPhotoInput" accept="image/*" hidden>
    <button type="submit" class="submit">Добавить</button>
  </form>

  <section class="history">
    <div class="eyebrow">История</div>
    <div id="list"></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <button type="button" class="close" id="modalClose" aria-label="Закрыть">✕</button>
  <img id="modalImg" alt="Фото траты">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyAPJbVrAp_9kkKAIv_amOkAa-ccyE57Os8",
    authDomain: "grocery-budget-34b85.firebaseapp.com",
    projectId: "grocery-budget-34b85",
    storageBucket: "grocery-budget-34b85.firebasestorage.app",
    messagingSenderId: "107806746639",
    appId: "1:107806746639:web:77f44b6344d1c4198c1b7a"
  };
  var fbApp = initializeApp(firebaseConfig);
  var db = getFirestore(fbApp, 'grocery-budget');
  var expensesCol = collection(db, 'expenses');
  var budgetsCol = collection(db, 'budgets');

  var DEFAULT_TOTAL = 664;
  var NUM_WEEKS = 4;
  var DAY = 86400000;

  var TOTAL = DEFAULT_TOTAL;
  var itemsCache = [];
  var budgetsCache = {}; // periodKey -> total
  function load() { return itemsCache; }

  // --- Периоды: "зарплатный" месяц с 22-го числа по 21-е следующего ---
  function today0() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function dateOnly(ts) {
    var d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  // "YYYY-MM-DD" для value инпута <input type="date">
  function dateInputValue(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayInputValue() { return dateInputValue(Date.now()); }
  // Берёт год/месяц/день из dateStr ("YYYY-MM-DD"), а время суток — из baseTs
  function combineDateKeepTime(dateStr, baseTs) {
    var parts = dateStr.split('-').map(Number);
    var base = new Date(baseTs);
    return new Date(parts[0], parts[1] - 1, parts[2], base.getHours(), base.getMinutes(), base.getSeconds(), base.getMilliseconds()).getTime();
  }
  function periodKeyFor(d) {
    var y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    if (day < 22) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
    return y + '-' + String(m + 1).padStart(2, '0');
  }
  function periodBounds(key) {
    var parts = key.split('-');
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1;
    return { start: new Date(y, m, 22), end: new Date(y, m + 1, 21) };
  }
  function currentPeriodKey() { return periodKeyFor(today0()); }
  function totalFor(key) {
    if (budgetsCache.hasOwnProperty(key)) return budgetsCache[key];
    var keys = Object.keys(budgetsCache).filter(function (k) { return k < key; }).sort();
    if (keys.length) return budgetsCache[keys[keys.length - 1]];
    return DEFAULT_TOTAL;
  }

  // --- Фото: хранилище в IndexedDB (локально на устройстве) ---
  var DB_NAME = 'grocery-budget-db';
  var STORE = 'photos';
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function putPhoto(id, blob) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function getPhoto(id) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readonly');
        var rq = tx.objectStore(STORE).get(id);
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function delPhoto(id) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    }).catch(function () {});
  }

  // Сжатие фото до разумного размера (макс. сторона 1200px, JPEG)
  function compress(file) {
    return new Promise(function (res, rej) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var max = 1200;
        var w = img.width, h = img.height;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.72);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }

  function zl(n) {
    var s = (Math.round(n * 100) / 100).toFixed(2).replace('.', ',').replace(/,00$/, '');
    return s + ' zł';
  }

  var fmtDay = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'short' });
  var fmtFull = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  function periodLabel(key) {
    var b = periodBounds(key);
    return fmtDay.format(b.start) + ' — ' + fmtDay.format(b.end);
  }

  var editingId = null;
  var collapsedPeriods = {}; // periodKey -> true, если пользователь свернул вручную
  function isExpanded(key, isCurrent) {
    if (collapsedPeriods.hasOwnProperty(key)) return !collapsedPeriods[key];
    return isCurrent;
  }
  var objectUrls = [];
  function freeUrls() {
    objectUrls.forEach(function (u) { URL.revokeObjectURL(u); });
    objectUrls = [];
  }

  function openModal(id) {
    getPhoto(id).then(function (blob) {
      if (!blob) return;
      var u = URL.createObjectURL(blob);
      var modal = document.getElementById('modal');
      var mimg = document.getElementById('modalImg');
      mimg.onload = function () { URL.revokeObjectURL(u); };
      mimg.src = u;
      modal.hidden = false;
    });
  }
  function closeModal() {
    var modal = document.getElementById('modal');
    modal.hidden = true;
    document.getElementById('modalImg').removeAttribute('src');
  }

  function render() {
    freeUrls();
    var allItems = load();
    var t = today0();
    var currentKey = currentPeriodKey();
    var pb = periodBounds(currentKey);
    var START = pb.start, END = pb.end;
    TOTAL = totalFor(currentKey);

    var periodDays = Math.round((END - START) / DAY) + 1;
    var curItems = allItems.filter(function (it) {
      var d0 = dateOnly(it.ts);
      return d0 >= START && d0 <= END;
    });
    var spent = curItems.reduce(function (s, it) { return s + it.amount; }, 0);
    var left = TOTAL - spent;
    var days = Math.round((END - t) / DAY) + 1;

    document.getElementById('periodEyebrow').textContent = 'Осталось до ' + fmtDay.format(END);
    var elTotal = document.getElementById('totalLeft');
    elTotal.textContent = zl(left);
    elTotal.classList.toggle('over', left < 0);
    document.getElementById('totalSub').textContent =
      'потрачено ' + zl(spent) + ' из ' + zl(TOTAL);
    document.getElementById('daysLeft').textContent = days;
    document.getElementById('perDay').textContent =
      days > 0 ? zl(Math.max(left, 0) / days) : '—';

    // Неделя: блоки по 7 дней от начала текущего периода; перерасход/недорасход
    // прошлых недель переносится на текущую
    var idx = Math.min(Math.max(Math.floor((t - START) / DAY / 7), 0), NUM_WEEKS - 1);
    var wStart = new Date(START.getTime() + idx * 7 * DAY);
    var wEnd = (idx === NUM_WEEKS - 1) ? new Date(END.getTime()) : new Date(wStart.getTime() + 6 * DAY);
    var daysElapsedThroughWeekEnd = Math.round((wEnd - START) / DAY) + 1;
    var cumulativeBudget = TOTAL / periodDays * daysElapsedThroughWeekEnd;
    var spentBeforeThisWeek = curItems.reduce(function (s, it) {
      var d0 = dateOnly(it.ts);
      return (d0 < wStart) ? s + it.amount : s;
    }, 0);
    var weekSpent = curItems.reduce(function (s, it) {
      var d0 = dateOnly(it.ts);
      return (d0 >= wStart && d0 <= wEnd) ? s + it.amount : s;
    }, 0);
    var weekAvailable = cumulativeBudget - spentBeforeThisWeek;
    var weekLeft = weekAvailable - weekSpent;

    document.getElementById('weekTitle').textContent = 'Неделя ' + (idx + 1) + ' из ' + NUM_WEEKS;
    var elWeekLeft = document.getElementById('weekLeft');
    elWeekLeft.textContent = zl(weekLeft);
    elWeekLeft.classList.toggle('over', weekLeft < 0);
    document.getElementById('weekOf').textContent = 'из ' + zl(weekAvailable);
    document.getElementById('weekRange').textContent =
      fmtDay.format(wStart) + ' — ' + fmtDay.format(wEnd) + ' · потрачено ' + zl(weekSpent);

    var pct = weekAvailable > 0 ? Math.min(weekSpent / weekAvailable, 1) : 1;
    var bar = document.getElementById('weekBar');
    bar.style.width = (pct * 100) + '%';
    bar.className = pct < 0.6 ? 'ok' : (pct < 0.9 ? 'warn' : 'bad');

    renderHistory(allItems, currentKey);
  }

  // --- История: аккордеон по месячным периодам ---
  function groupByPeriod(items) {
    var map = {};
    items.forEach(function (it) {
      var key = periodKeyFor(dateOnly(it.ts));
      if (!map[key]) map[key] = [];
      map[key].push(it);
    });
    return map;
  }

  function renderHistory(allItems, currentKey) {
    var list = document.getElementById('list');
    list.innerHTML = '';
    if (!allItems.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Пока нет трат — добавьте первую выше';
      list.appendChild(e);
      return;
    }

    var groups = groupByPeriod(allItems);
    if (!groups[currentKey]) groups[currentKey] = [];
    var keys = Object.keys(groups).sort().reverse(); // "YYYY-MM" сортируется хронологически

    keys.forEach(function (key) {
      var itemsForPeriod = groups[key].slice().sort(function (a, b) { return b.ts - a.ts; });
      var isCurrent = key === currentKey;
      var groupSpent = itemsForPeriod.reduce(function (s, it) { return s + it.amount; }, 0);
      var expanded = isExpanded(key, isCurrent);

      var group = document.createElement('div');
      group.className = 'period-group';

      var header = document.createElement('button');
      header.type = 'button';
      header.className = 'period-header';
      header.setAttribute('aria-expanded', expanded ? 'true' : 'false');

      var headLeft = document.createElement('div');
      headLeft.className = 'period-head-left';
      var headTitle = document.createElement('div');
      headTitle.className = 'period-title';
      headTitle.textContent = (isCurrent ? 'Текущий период · ' : '') + periodLabel(key);
      var headSub = document.createElement('div');
      headSub.className = 'period-sub';
      var count = itemsForPeriod.length;
      headSub.textContent = count + (count === 1 ? ' трата' : (count >= 2 && count <= 4 ? ' траты' : ' трат')) + ' · ' + zl(groupSpent);
      headLeft.appendChild(headTitle);
      headLeft.appendChild(headSub);

      var chevron = document.createElement('div');
      chevron.className = 'period-chevron';
      chevron.textContent = expanded ? '▾' : '▸';

      header.appendChild(headLeft);
      header.appendChild(chevron);
      header.addEventListener('click', function () {
        collapsedPeriods[key] = expanded; // если сейчас развёрнуто — сворачиваем, и наоборот
        render();
      });

      var body = document.createElement('div');
      body.className = 'period-body';
      body.hidden = !expanded;

      if (!itemsForPeriod.length) {
        var pe = document.createElement('div');
        pe.className = 'empty';
        pe.textContent = 'Нет трат в этом периоде';
        body.appendChild(pe);
      } else {
        itemsForPeriod.forEach(function (it) { renderEntry(body, it); });
      }

      group.appendChild(header);
      group.appendChild(body);
      list.appendChild(group);
    });
  }

  function renderEntry(container, it) {
    var row = document.createElement('div');
    row.className = 'entry';

    if (editingId === it.id) {
      row.className = 'entry editing';

      var fields = document.createElement('div');
      fields.className = 'edit-fields';
      var dateInput = document.createElement('input');
      dateInput.className = 'e-date';
      dateInput.type = 'date';
      dateInput.max = todayInputValue();
      dateInput.value = dateInputValue(it.ts);
      dateInput.setAttribute('aria-label', 'Дата траты');
      var amtInput = document.createElement('input');
      amtInput.className = 'e-amt';
      amtInput.type = 'text';
      amtInput.setAttribute('inputmode', 'decimal');
      amtInput.value = String(it.amount).replace('.', ',');
      amtInput.setAttribute('aria-label', 'Сумма');
      var noteInput = document.createElement('input');
      noteInput.className = 'e-note';
      noteInput.type = 'text';
      noteInput.maxLength = 80;
      noteInput.placeholder = 'Заметка (необязательно)';
      noteInput.value = it.note || '';
      noteInput.setAttribute('aria-label', 'Заметка');
      fields.appendChild(dateInput);
      fields.appendChild(amtInput);
      fields.appendChild(noteInput);

      // Фото в режиме редактирования
      var photoRow = document.createElement('div');
      photoRow.className = 'edit-photo';
      var pendingBlob = null;      // новый выбранный файл
      var removePhoto = false;     // пометка на удаление
      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.hidden = true;

      var previewWrap = document.createElement('div');
      previewWrap.className = 'photo-preview';
      previewWrap.hidden = true;
      var previewImg = document.createElement('img');
      previewImg.alt = 'Фото';
      var previewRm = document.createElement('button');
      previewRm.type = 'button';
      previewRm.className = 'rm';
      previewRm.textContent = '✕';
      previewRm.setAttribute('aria-label', 'Убрать фото');
      previewWrap.appendChild(previewImg);
      previewWrap.appendChild(previewRm);

      var photoBtn = document.createElement('button');
      photoBtn.type = 'button';
      photoBtn.className = 'photo-btn';

      function refreshPhotoBtn() {
        photoBtn.textContent = (previewWrap.hidden ? '📷 Добавить фото' : '📷 Заменить фото');
      }
      function showPreviewFromBlob(blob) {
        var u = URL.createObjectURL(blob);
        objectUrls.push(u);
        previewImg.src = u;
        previewWrap.hidden = false;
        refreshPhotoBtn();
      }
      // показать существующее фото, если есть
      if (it.hasPhoto) {
        getPhoto(it.id).then(function (blob) {
          if (blob && !removePhoto && !pendingBlob) showPreviewFromBlob(blob);
        });
      }
      photoBtn.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        compress(f).then(function (blob) {
          pendingBlob = blob;
          removePhoto = false;
          showPreviewFromBlob(blob);
        }).catch(function () { alert('Не удалось обработать фото'); });
      });
      previewRm.addEventListener('click', function () {
        pendingBlob = null;
        removePhoto = true;
        previewImg.removeAttribute('src');
        previewWrap.hidden = true;
        fileInput.value = '';
        refreshPhotoBtn();
      });
      refreshPhotoBtn();
      photoRow.appendChild(photoBtn);
      photoRow.appendChild(previewWrap);
      photoRow.appendChild(fileInput);

      var actions = document.createElement('div');
      actions.className = 'edit-actions';
      var saveBtn = document.createElement('button');
      saveBtn.className = 'esave';
      saveBtn.type = 'button';
      saveBtn.textContent = 'Сохранить';
      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'ecancel';
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);

      function commitEdit() {
        var v = parseFloat(amtInput.value.replace(',', '.'));
        if (!isFinite(v) || v <= 0) { amtInput.focus(); return; }
        var patch = {
          amount: Math.round(v * 100) / 100,
          note: noteInput.value.trim(),
          ts: dateInput.value ? combineDateKeepTime(dateInput.value, it.ts) : it.ts
        };

        var photoOp = Promise.resolve();
        if (pendingBlob) {
          photoOp = putPhoto(it.id, pendingBlob);
          patch.hasPhoto = true;
        } else if (removePhoto) {
          photoOp = delPhoto(it.id);
          patch.hasPhoto = false;
        }
        photoOp.then(function () {
          return updateDoc(doc(db, 'expenses', it.id), patch);
        }).then(function () {
          editingId = null;
          render();
        });
      }
      saveBtn.addEventListener('click', commitEdit);
      dateInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitEdit(); });
      amtInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitEdit(); });
      noteInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitEdit(); });
      cancelBtn.addEventListener('click', function () { editingId = null; render(); });

      row.appendChild(fields);
      row.appendChild(photoRow);
      row.appendChild(actions);
      container.appendChild(row);
      return;
    }

    if (it.hasPhoto) {
      var thumb = document.createElement('img');
      thumb.className = 'thumb';
      thumb.alt = 'Фото траты';
      (function (id) {
        getPhoto(id).then(function (blob) {
          if (blob) { var u = URL.createObjectURL(blob); objectUrls.push(u); thumb.src = u; }
        });
      })(it.id);
      thumb.addEventListener('click', function () { openModal(it.id); });
      row.appendChild(thumb);
    }

    var info = document.createElement('div');
    info.className = 'info';
    var amt = document.createElement('div');
    amt.className = 'amt';
    amt.textContent = zl(it.amount);
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = fmtFull.format(new Date(it.ts)) + (it.note ? ' · ' + it.note : '');
    info.appendChild(amt);
    info.appendChild(meta);

    var acts = document.createElement('div');
    acts.className = 'actions';
    var edit = document.createElement('button');
    edit.className = 'iconbtn edit';
    edit.type = 'button';
    edit.textContent = '✎';
    edit.setAttribute('aria-label', 'Редактировать трату ' + zl(it.amount));
    edit.addEventListener('click', function () {
      editingId = it.id;
      render();
    });
    var del = document.createElement('button');
    del.className = 'iconbtn del';
    del.type = 'button';
    del.textContent = '✕';
    del.setAttribute('aria-label', 'Удалить трату ' + zl(it.amount));
    del.addEventListener('click', function () {
      delPhoto(it.id);
      deleteDoc(doc(db, 'expenses', it.id));
    });
    acts.appendChild(edit);
    acts.appendChild(del);

    row.appendChild(info);
    row.appendChild(acts);
    container.appendChild(row);
  }

  // --- Прикрепление фото в форме добавления ---
  var addPendingBlob = null;
  document.getElementById('addPhotoBtn').addEventListener('click', function () {
    document.getElementById('addPhotoInput').click();
  });
  document.getElementById('addPhotoInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    compress(f).then(function (blob) {
      addPendingBlob = blob;
      var u = URL.createObjectURL(blob);
      var img = document.getElementById('addPhotoImg');
      img.onload = function () { URL.revokeObjectURL(u); };
      img.src = u;
      document.getElementById('addPhotoPreview').hidden = false;
    }).catch(function () { alert('Не удалось обработать фото'); });
  });
  function clearAddPhoto() {
    addPendingBlob = null;
    document.getElementById('addPhotoInput').value = '';
    document.getElementById('addPhotoImg').removeAttribute('src');
    document.getElementById('addPhotoPreview').hidden = true;
  }
  document.getElementById('addPhotoRemove').addEventListener('click', clearAddPhoto);

  var dateEl = document.getElementById('entryDate');
  dateEl.max = todayInputValue();
  dateEl.value = todayInputValue();

  document.getElementById('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var amountEl = document.getElementById('amount');
    var noteEl = document.getElementById('note');
    var amount = parseFloat(amountEl.value.replace(',', '.'));
    if (!isFinite(amount) || amount <= 0) { amountEl.focus(); return; }
    var id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    var ts = dateEl.value ? combineDateKeepTime(dateEl.value, Date.now()) : Date.now();
    var entry = {
      amount: Math.round(amount * 100) / 100,
      note: noteEl.value.trim(),
      ts: ts,
      hasPhoto: !!addPendingBlob
    };
    var photoOp = addPendingBlob ? putPhoto(id, addPendingBlob) : Promise.resolve();
    photoOp.then(function () {
      return setDoc(doc(db, 'expenses', id), entry);
    }).then(function () {
      amountEl.value = '';
      noteEl.value = '';
      clearAddPhoto();
      amountEl.focus();
    });
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  // --- Редактирование бюджета текущего месячного периода ---
  // Поле открывается пустым; ввод +60 добавляет к текущей сумме, -60 вычитает,
  // а обычное число (без знака) заменяет бюджет целиком. Сохраняется одним
  // действием при закрытии поля (Enter/уход фокуса) — не на каждой нажатой клавише,
  // чтобы промежуточные недописанные значения никогда не попадали на сервер.
  function openBudgetEdit() {
    var inp = document.getElementById('budgetInput');
    inp.value = '';
    inp.placeholder = 'сейчас ' + zl(TOTAL) + ' · +60 добавить';
    document.getElementById('budgetEdit').hidden = false;
    document.getElementById('budgetBtn').hidden = true;
    inp.focus();
  }
  function commitBudget() {
    var inp = document.getElementById('budgetInput');
    var raw = inp.value.trim();
    if (raw) {
      var isDelta = raw[0] === '+' || raw[0] === '-';
      var v = parseFloat(raw.replace(',', '.'));
      if (isFinite(v)) {
        var newTotal = isDelta ? TOTAL + v : v;
        if (newTotal > 0) {
          TOTAL = Math.round(newTotal * 100) / 100;
          budgetsCache[currentPeriodKey()] = TOTAL;
          setDoc(doc(db, 'budgets', currentPeriodKey()), { total: TOTAL });
        }
      }
    }
    document.getElementById('budgetEdit').hidden = true;
    document.getElementById('budgetBtn').hidden = false;
    render();
  }
  document.getElementById('budgetBtn').addEventListener('click', openBudgetEdit);
  document.getElementById('budgetInput').addEventListener('blur', commitBudget);
  document.getElementById('budgetInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitBudget(); }
    else if (e.key === 'Escape') {
      e.preventDefault();
      document.getElementById('budgetInput').value = '';
      document.getElementById('budgetInput').blur();
    }
  });

  onSnapshot(expensesCol, function (snapshot) {
    itemsCache = snapshot.docs.map(function (d) {
      var data = d.data();
      data.id = d.id;
      return data;
    });
    render();
  });

  onSnapshot(budgetsCol, function (snapshot) {
    budgetsCache = {};
    snapshot.docs.forEach(function (d) {
      var data = d.data();
      if (data && isFinite(data.total) && data.total > 0) budgetsCache[d.id] = data.total;
    });
    render();
  });

  render();
</script>
