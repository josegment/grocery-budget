<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040833">
<title>Бюджет на продукты</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: #040833;
    color: #fff;
    line-height: 1.35;
    transition: background-color 1.5s ease;
    overflow-x: hidden;
  }

  /* ---------- плавающий градиент ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .85; transition: background-color 1.5s ease; will-change: transform; }
  .b1 { width: 70vmax; height: 70vmax; top: -30vmax; left: -20vmax; animation: f1 22s ease-in-out infinite alternate; }
  .b2 { width: 55vmax; height: 55vmax; top: 10vmax; right: -25vmax; animation: f2 26s ease-in-out infinite alternate; }
  .b3 { width: 60vmax; height: 60vmax; bottom: -35vmax; left: -10vmax; animation: f3 30s ease-in-out infinite alternate; opacity: .6; }
  .b4 { width: 35vmax; height: 35vmax; top: 30vmax; left: 20vmax; animation: f4 18s ease-in-out infinite alternate; opacity: .5; }
  @keyframes f1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(18vmax, 10vmax) scale(1.15); } }
  @keyframes f2 { 0% { transform: translate(0,0) scale(1.1); } 100% { transform: translate(-20vmax, 14vmax) scale(.9); } }
  @keyframes f3 { 0% { transform: translate(0,0) scale(.95); } 100% { transform: translate(15vmax, -18vmax) scale(1.2); } }
  @keyframes f4 { 0% { transform: translate(0,0); } 100% { transform: translate(-14vmax, -10vmax) scale(1.3); } }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 70%, rgba(0,0,0,.6) 100%); }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

  /* ---------- раскладка ---------- */
  .app {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  .topbar { display: flex; justify-content: center; }
  .pill-title {
    background: rgba(255,255,255,.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.9);
  }

  /* ---------- остаток ---------- */
  .hero { text-align: center; padding: 44px 0 22px; }
  .hero-label { font-size: 16px; color: rgba(255,255,255,.85); font-weight: 500; }
  .big-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px 0 4px; padding-left: 44px; }
  .big { font-size: 60px; font-weight: 700; letter-spacing: -2px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .big.over { color: #ffb4a2; }
  .edit-icon {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: rgba(255,255,255,.14); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 0; color: #fff; font: inherit; font-size: 16px; cursor: pointer;
  }
  .edit-icon:active { background: rgba(255,255,255,.28); }
  .hero-sub { font-size: 14px; color: rgba(255,255,255,.7); }
  .budget-edit { margin: 14px auto 0; max-width: 300px; }
  .budget-edit .txt {
    display: block; width: 100%; margin: 0; height: 52px;
    font: inherit; font-size: 22px; font-weight: 650; text-align: center; font-variant-numeric: tabular-nums;
    padding: 12px 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 16px;
    background: rgba(255,255,255,.14); color: #fff;
    -webkit-appearance: none; appearance: none;
  }
  .budget-edit .txt::placeholder { color: rgba(255,255,255,.55); font-size: 17px; font-weight: 500; }
  .budget-edit .txt:focus { outline: 2px solid rgba(255,255,255,.7); outline-offset: -1px; }
  .hero-pill {
    display: inline-block; margin-top: 18px;
    background: rgba(255,255,255,.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 999px; padding: 10px 20px; font-size: 15px; font-weight: 600;
  }

  /* ---------- круглые кнопки ---------- */
  .actions { display: flex; justify-content: center; gap: 56px; margin: 18px 0 26px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; color: #fff; cursor: pointer; font: inherit; padding: 0; }
  .action .circle {
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(255,255,255,.16); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: grid; place-items: center; transition: transform .12s ease;
  }
  .action.primary .circle { background: #fff; color: #111; }
  .action span { font-size: 13px; font-weight: 500; }
  .action:active .circle { transform: scale(.94); }
  .action:focus-visible .circle { outline: 2px solid #fff; outline-offset: 3px; }

  /* ---------- стеклянные карточки ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .card {
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px; padding: 16px; min-width: 0;
  }
  .card .k { font-size: 13px; color: rgba(255,255,255,.7); font-weight: 500; }
  .card .v { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .v.over { color: #ffb4a2; }
  .card .s { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: rgba(255,255,255,.15); border-radius: 6px; margin: 12px 0 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 6px; transition: width .5s ease, background-color .5s; }
  .bar .ok { background: #fff; }
  .bar .warn { background: #ffc56b; }
  .bar .bad { background: #ff6b5b; }

  .activity-card { margin-bottom: 22px; }
  .activity-card .s { margin-top: 4px; }
  .activity { display: flex; align-items: flex-end; gap: 6px; height: 74px; margin-top: 14px; }
  .activity .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
  .activity .stick { width: 100%; max-width: 22px; border-radius: 6px; background: rgba(255,255,255,.22); min-height: 6px; transition: height .5s ease; }
  .activity .stick.today { background: #fff; }
  .activity .stick.over { background: #ffb4a2; }
  .activity .d { font-size: 11px; color: rgba(255,255,255,.55); }
  .activity .d.today { color: #fff; font-weight: 600; }

  /* ---------- история ---------- */
  .history { scroll-margin-top: 16px; }
  .section-title { font-size: 20px; font-weight: 700; margin: 4px 4px 12px; }
  .period-group { margin-bottom: 10px; }
  .period-header {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid rgba(255,255,255,.12); border-radius: 22px;
    padding: 14px 16px; cursor: pointer; font: inherit; text-align: left; color: #fff;
  }
  .period-header:active { background: rgba(255,255,255,.18); }
  .period-group.is-current .period-header { border-color: rgba(255,255,255,.45); }
  .period-head-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .period-eyebrow { font-size: 11.5px; font-weight: 650; text-transform: lowercase; color: rgba(255,255,255,.75); letter-spacing: .02em; }
  .period-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .period-sub { font-size: 13px; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
  .period-chevron { font-size: 15px; color: rgba(255,255,255,.7); flex-shrink: 0; }
  .period-body {
    margin-top: 6px; padding: 4px 14px;
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 22px;
  }

  .entry { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .entry:last-child { border-bottom: none; }
  .entry .thumb { width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,.12); cursor: pointer; display: block; }
  .entry .info { flex: 1; min-width: 0; }
  .entry .amt { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .entry .meta { font-size: 12.5px; color: rgba(255,255,255,.55); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .actions { display: flex; flex-shrink: 0; }
  .entry .iconbtn { font: inherit; font-size: 16px; color: rgba(255,255,255,.6); background: none; border: 0; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; }
  .entry .edit:active { background: rgba(255,255,255,.12); color: #fff; }
  .entry .del:active { background: rgba(255,90,78,.25); color: #fff; }
  .empty { color: rgba(255,255,255,.55); font-size: 14px; text-align: center; padding: 18px 0; }

  .entry.editing { flex-direction: column; align-items: stretch; gap: 8px; padding: 14px 0; }
  .entry .edit-fields { display: flex; flex-direction: column; gap: 8px; }
  .entry .edit-fields input {
    display: block; width: 100%; margin: 0; height: 48px;
    font: inherit; font-size: 17px; line-height: 1.3; padding: 12px;
    border: 1px solid rgba(255,255,255,.18); border-radius: 14px;
    background: rgba(255,255,255,.12); color: #fff;
    -webkit-appearance: none; appearance: none;
  }
  .entry .edit-fields input::placeholder { color: rgba(255,255,255,.5); }
  .entry .edit-fields input:focus { outline: 2px solid rgba(255,255,255,.7); outline-offset: -1px; }
  .entry .edit-fields input.e-amt { font-weight: 650; font-variant-numeric: tabular-nums; }
  .entry .edit-fields input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .entry .edit-photo { display: flex; align-items: center; gap: 10px; }
  .entry .edit-actions { display: flex; gap: 8px; }
  .entry .edit-actions button { font: inherit; font-size: 16px; font-weight: 650; min-height: 46px; flex: 1; border: 0; border-radius: 999px; cursor: pointer; }
  .entry .edit-actions .esave { background: #fff; color: #111; }
  .entry .edit-actions .ecancel { background: rgba(255,255,255,.16); color: #fff; }
  .entry .edit-actions button:active { opacity: .85; }

  /* ---------- фото (общие) ---------- */
  .photo-btn {
    font: inherit; font-size: 15px; font-weight: 600; color: #fff;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 11px 16px; min-height: 46px; cursor: pointer;
  }
  .photo-btn:active { opacity: .85; }
  .photo-preview { position: relative; flex-shrink: 0; }
  .photo-preview img { width: 50px; height: 50px; object-fit: cover; border-radius: 12px; display: block; }
  .photo-preview .rm {
    position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%;
    background: #111; color: #fff; border: 2px solid #fff; font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- шторка добавления ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 460px; margin: 0 auto; max-height: 92vh; overflow-y: auto;
    background: #f4f4f7; color: #111; color-scheme: light;
    border-radius: 28px 28px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 22px);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.3,1);
    visibility: hidden;
  }
  .sheet.show { transform: translateY(0); visibility: visible; }
  .grip { width: 40px; height: 5px; border-radius: 5px; background: #d0d0d6; margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; text-align: center; }
  form.add { display: flex; flex-direction: column; gap: 10px; }
  .amount-wrap { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  .amount-wrap input {
    font: inherit; font-size: 52px; font-weight: 700; letter-spacing: -1.5px; text-align: right;
    width: 200px; border: none; background: transparent; color: #111; outline: none; padding: 0;
    font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none;
  }
  .amount-wrap input::placeholder { color: #c4c4cc; }
  .amount-wrap .cur { font-size: 28px; font-weight: 600; color: #888; }
  .add input.txt {
    display: block; width: 100%; margin: 0; height: 50px;
    font: inherit; font-size: 16px; line-height: 1.3; padding: 13px 16px;
    border: none; border-radius: 14px; background: #fff; color: #111;
    -webkit-appearance: none; appearance: none;
  }
  .add input.txt::placeholder { color: #a0a0a8; }
  .add input.txt:focus { outline: 2px solid #111; outline-offset: -1px; }
  .add input[type="date"].txt::-webkit-date-and-time-value { text-align: left; }
  .sheet .photo-attach { display: flex; align-items: center; gap: 10px; min-height: 50px; }
  .sheet .photo-btn { background: #fff; color: #333; border: none; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .sheet .photo-preview .rm { border-color: #f4f4f7; }
  .add button.submit {
    width: 100%; border: none; border-radius: 999px; padding: 17px; font: inherit; font-size: 17px; font-weight: 600;
    background: #111; color: #fff; cursor: pointer; margin-top: 4px;
  }
  .add button.submit:active { transform: scale(.98); }

  /* ---------- просмотр фото ---------- */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .modal .close {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.15); color: #fff; border: 0; font-size: 22px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1" id="b1"></div>
  <div class="blob b2" id="b2"></div>
  <div class="blob b3" id="b3"></div>
  <div class="blob b4" id="b4"></div>
</div>

<div class="app">
  <div class="topbar"><div class="pill-title">Продукты · на двоих</div></div>

  <section class="hero">
    <div class="hero-label" id="periodEyebrow">Осталось</div>
    <div class="big-row">
      <div class="big" id="totalLeft">—</div>
      <button type="button" class="edit-icon" id="budgetBtn" aria-label="Изменить остаток">✎</button>
    </div>
    <div class="hero-sub" id="totalSub"></div>
    <div class="budget-edit" id="budgetEdit" hidden>
      <input class="txt" id="budgetInput" type="text" inputmode="decimal" placeholder="Сколько должно остаться, zł" aria-label="Сколько должно остаться, zł">
    </div>
    <div class="hero-pill"><span id="daysLeft">—</span> дн. до конца периода</div>
  </section>

  <div class="actions">
    <button type="button" class="action primary" id="addBtn">
      <div class="circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <span>Трата</span>
    </button>
    <button type="button" class="action" id="historyBtn">
      <div class="circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
      <span>История</span>
    </button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="k">На эту неделю</div>
      <div class="v" id="weekLeft">—</div>
      <div class="s" id="weekOf">—</div>
      <div class="bar"><div id="weekBar" class="ok"></div></div>
      <div class="s" id="weekTitle">—</div>
    </div>
    <div class="card">
      <div class="k">Сумма на день</div>
      <div class="v" id="perDay">—</div>
      <div class="s">в среднем до конца периода</div>
    </div>
  </div>

  <div class="card activity-card">
    <div class="k">Активность недели</div>
    <div class="s" id="weekRange">—</div>
    <div class="activity" id="activity"></div>
  </div>

  <section class="history" id="historySection">
    <div class="section-title">История</div>
    <div id="list"></div>
  </section>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Новая трата">
  <div class="grip"></div>
  <h3>Новая трата</h3>
  <form class="add" id="addForm" autocomplete="off">
    <div class="amount-wrap">
      <input id="amount" type="text" inputmode="decimal" placeholder="0" aria-label="Сумма в злотых">
      <span class="cur">zł</span>
    </div>
    <input class="txt" id="entryDate" type="date" aria-label="Дата траты">
    <input class="txt" id="note" type="text" placeholder="Заметка — например, Biedronka" aria-label="Заметка" maxlength="80">
    <div class="photo-attach">
      <button type="button" class="photo-btn" id="addPhotoBtn">📷 Добавить фото</button>
      <div class="photo-preview" id="addPhotoPreview" hidden>
        <img id="addPhotoImg" alt="Предпросмотр фото">
        <button type="button" class="rm" id="addPhotoRemove" aria-label="Убрать фото">✕</button>
      </div>
    </div>
    <input type="file" id="addPhotoInput" accept="image/*" hidden>
    <button type="submit" class="submit">Добавить</button>
  </form>
</div>

<div class="modal" id="modal" hidden>
  <button type="button" class="close" id="modalClose" aria-label="Закрыть">✕</button>
  <img id="modalImg" alt="Фото траты">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyAPJbVrAp_9kkKAIv_amOkAa-ccyE57Os8",
    authDomain: "grocery-budget-34b85.firebaseapp.com",
    projectId: "grocery-budget-34b85",
    storageBucket: "grocery-budget-34b85.firebasestorage.app",
    messagingSenderId: "107806746639",
    appId: "1:107806746639:web:77f44b6344d1c4198c1b7a"
  };
  var fbApp = initializeApp(firebaseConfig);
  var db = getFirestore(fbApp, 'grocery-budget');
  var expensesCol = collection(db, 'expenses');
  var budgetsCol = collection(db, 'budgets');

  var DEFAULT_TOTAL = 664;
  var NUM_WEEKS = 4;
  var DAY = 86400000;

  var TOTAL = DEFAULT_TOTAL;
  var itemsCache = [];
  var budgetsCache = {}; // periodKey -> total
  function load() { return itemsCache; }

  // --- Периоды: "зарплатный" месяц с 22-го числа по 21-е следующего ---
  function today0() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function dateOnly(ts) {
    var d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  // "YYYY-MM-DD" для value инпута <input type="date">
  function dateInputValue(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayInputValue() { return dateInputValue(Date.now()); }
  // Берёт год/месяц/день из dateStr ("YYYY-MM-DD"), а время суток — из baseTs
  function combineDateKeepTime(dateStr, baseTs) {
    var parts = dateStr.split('-').map(Number);
    var base = new Date(baseTs);
    return new Date(parts[0], parts[1] - 1, parts[2], base.getHours(), base.getMinutes(), base.getSeconds(), base.getMilliseconds()).getTime();
  }
  function periodKeyFor(d) {
    var y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    if (day < 22) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
    return y + '-' + String(m + 1).padStart(2, '0');
  }
  function periodBounds(key) {
    var parts = key.split('-');
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1;
    return { start: new Date(y, m, 22), end: new Date(y, m + 1, 21) };
  }
  function currentPeriodKey() { return periodKeyFor(today0()); }
  function totalFor(key) {
    if (budgetsCache.hasOwnProperty(key)) return budgetsCache[key];
    var keys = Object.keys(budgetsCache).filter(function (k) { return k < key; }).sort();
    if (keys.length) return budgetsCache[keys[keys.length - 1]];
    return DEFAULT_TOTAL;
  }
  function currentPeriodItems() {
    var pb = periodBounds(currentPeriodKey());
    return load().filter(function (it) {
      var d0 = dateOnly(it.ts);
      return d0 >= pb.start && d0 <= pb.end;
    });
  }
  function currentSpent() {
    return currentPeriodItems().reduce(function (s, it) { return s + it.amount; }, 0);
  }

  // --- Фото: хранилище в IndexedDB (локально на устройстве) ---
  var DB_NAME = 'grocery-budget-db';
  var STORE = 'photos';
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function putPhoto(id, blob) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function getPhoto(id) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readonly');
        var rq = tx.objectStore(STORE).get(id);
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function delPhoto(id) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    }).catch(function () {});
  }

  // Сжатие фото до разумного размера (макс. сторона 1200px, JPEG)
  function compress(file) {
    return new Promise(function (res, rej) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var max = 1200;
        var w = img.width, h = img.height;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.72);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }

  function zl(n) {
    var s = (Math.round(n * 100) / 100).toFixed(2).replace('.', ',').replace(/,00$/, '');
    return s + ' zł';
  }

  var fmtDay = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'short' });
  var fmtFull = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  function periodLabel(key) {
    var b = periodBounds(key);
    return fmtDay.format(b.start) + ' — ' + fmtDay.format(b.end);
  }

  var fmtMonth = new Intl.DateTimeFormat('ru', { month: 'long' });
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function periodMonthLabel(key) {
    var b = periodBounds(key);
    var m1 = capitalize(fmtMonth.format(b.start));
    var m2 = capitalize(fmtMonth.format(b.end));
    return m1 === m2 ? m1 : (m1 + ' — ' + m2);
  }

  var editingId = null;
  var collapsedPeriods = {}; // periodKey -> true, если пользователь свернул вручную
  function isExpanded(key, isCurrent) {
    if (collapsedPeriods.hasOwnProperty(key)) return !collapsedPeriods[key];
    return isCurrent;
  }
  var objectUrls = [];
  function freeUrls() {
    objectUrls.forEach(function (u) { URL.revokeObjectURL(u); });
    objectUrls = [];
  }

  function openModal(id) {
    getPhoto(id).then(function (blob) {
      if (!blob) return;
      var u = URL.createObjectURL(blob);
      var modal = document.getElementById('modal');
      var mimg = document.getElementById('modalImg');
      mimg.onload = function () { URL.revokeObjectURL(u); };
      mimg.src = u;
      modal.hidden = false;
    });
  }
  function closeModal() {
    var modal = document.getElementById('modal');
    modal.hidden = true;
    document.getElementById('modalImg').removeAttribute('src');
  }

  // --- Визуальный слой: фон по остатку, столбики недели, шторка ---
  var PAL = {
    green: { bg: '#03231a', b1: '#0f9d6b', b2: '#34d399', b3: '#065f46', b4: '#a7f3d0' },
    blue:  { bg: '#040833', b1: '#1d3cff', b2: '#4f7bff', b3: '#0a1580', b4: '#8fb0ff' },
    terra: { bg: '#2a0e07', b1: '#c4553a', b2: '#e58a62', b3: '#7a2a17', b4: '#f2c2a0' }
  };
  var STOPS = [
    { p: 0.00, pal: PAL.terra },
    { p: 0.22, pal: PAL.terra },
    { p: 0.50, pal: PAL.blue },
    { p: 0.78, pal: PAL.green },
    { p: 1.00, pal: PAL.green }
  ];
  function hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function mixHex(a, b, u) {
    var A = hex2rgb(a), B = hex2rgb(b);
    return 'rgb(' + A.map(function (v, i) { return Math.round(v + (B[i] - v) * u); }).join(',') + ')';
  }
  function paletteAt(t) {
    t = Math.max(0, Math.min(1, t));
    for (var i = 0; i < STOPS.length - 1; i++) {
      var s = STOPS[i], e = STOPS[i + 1];
      if (t >= s.p && t <= e.p) {
        var u = e.p === s.p ? 0 : (t - s.p) / (e.p - s.p);
        var out = {};
        for (var k in s.pal) out[k] = mixHex(s.pal[k], e.pal[k], u);
        return out;
      }
    }
    return PAL.green;
  }
  function applyPalette(t) {
    var p = paletteAt(isFinite(t) ? t : 0);
    document.body.style.backgroundColor = p.bg;
    ['b1', 'b2', 'b3', 'b4'].forEach(function (k) { document.getElementById(k).style.backgroundColor = p[k]; });
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', p.bg);
  }
  var fmtWeekday = new Intl.DateTimeFormat('ru', { weekday: 'short' });
  function renderActivity(curItems, wStart, wEnd, weekAvailable, t) {
    var n = Math.round((wEnd - wStart) / DAY) + 1;
    var daily = weekAvailable > 0 ? weekAvailable / n : 0;
    var cols = [];
    for (var i = 0; i < n; i++) {
      var d = new Date(wStart.getFullYear(), wStart.getMonth(), wStart.getDate() + i);
      var sum = curItems.reduce(function (s, it) { return dateOnly(it.ts).getTime() === d.getTime() ? s + it.amount : s; }, 0);
      cols.push({ d: d, sum: sum });
    }
    var max = Math.max(daily * 1.5, 1);
    cols.forEach(function (c) { if (c.sum > max) max = c.sum; });
    document.getElementById('activity').innerHTML = cols.map(function (c) {
      var h = c.sum > 0 ? Math.max(10, c.sum / max * 100) : 6;
      var isToday = c.d.getTime() === t.getTime();
      var cls = 'stick' + (daily > 0 && c.sum > daily * 1.5 ? ' over' : '') + (isToday ? ' today' : '');
      var wd = fmtWeekday.format(c.d).slice(0, 2);
      return '<div class="col" title="' + zl(c.sum) + '"><div class="' + cls + '" style="height:' + h + '%"></div><div class="d' + (isToday ? ' today' : '') + '">' + wd + '</div></div>';
    }).join('');
  }
  function openSheet() {
    document.getElementById('overlay').classList.add('show');
    document.getElementById('sheet').classList.add('show');
    setTimeout(function () { document.getElementById('amount').focus(); }, 250);
  }
  function closeSheet() {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('sheet').classList.remove('show');
    document.getElementById('amount').blur();
    document.getElementById('note').blur();
  }

  function render() {
    freeUrls();
    var allItems = load();
    var t = today0();
    var currentKey = currentPeriodKey();
    var pb = periodBounds(currentKey);
    var START = pb.start, END = pb.end;
    TOTAL = totalFor(currentKey);

    var periodDays = Math.round((END - START) / DAY) + 1;
    var curItems = currentPeriodItems();
    var spent = curItems.reduce(function (s, it) { return s + it.amount; }, 0);
    var left = TOTAL - spent;
    var days = Math.round((END - t) / DAY) + 1;

    document.getElementById('periodEyebrow').textContent = 'Осталось до ' + fmtDay.format(END);
    var elTotal = document.getElementById('totalLeft');
    elTotal.textContent = zl(left);
    elTotal.classList.toggle('over', left < 0);
    document.getElementById('totalSub').textContent =
      'потрачено ' + zl(spent) + ' из ' + zl(TOTAL);
    document.getElementById('daysLeft').textContent = days;
    document.getElementById('perDay').textContent =
      days > 0 ? zl(Math.max(left, 0) / days) : '—';

    // Неделя: блоки по 7 дней от начала текущего периода; перерасход/недорасход
    // прошлых недель переносится на текущую
    var idx = Math.min(Math.max(Math.floor((t - START) / DAY / 7), 0), NUM_WEEKS - 1);
    var wStart = new Date(START.getTime() + idx * 7 * DAY);
    var wEnd = (idx === NUM_WEEKS - 1) ? new Date(END.getTime()) : new Date(wStart.getTime() + 6 * DAY);
    var daysElapsedThroughWeekEnd = Math.round((wEnd - START) / DAY) + 1;
    var cumulativeBudget = TOTAL / periodDays * daysElapsedThroughWeekEnd;
    var spentBeforeThisWeek = curItems.reduce(function (s, it) {
      var d0 = dateOnly(it.ts);
      return (d0 < wStart) ? s + it.amount : s;
    }, 0);
    var weekSpent = curItems.reduce(function (s, it) {
      var d0 = dateOnly(it.ts);
      return (d0 >= wStart && d0 <= wEnd) ? s + it.amount : s;
    }, 0);
    var weekAvailable = cumulativeBudget - spentBeforeThisWeek;
    var weekLeft = weekAvailable - weekSpent;

    document.getElementById('weekTitle').textContent = 'Неделя ' + (idx + 1) + ' из ' + NUM_WEEKS;
    var elWeekLeft = document.getElementById('weekLeft');
    elWeekLeft.textContent = zl(weekLeft);
    elWeekLeft.classList.toggle('over', weekLeft < 0);
    document.getElementById('weekOf').textContent = 'из ' + zl(weekAvailable);
    document.getElementById('weekRange').textContent =
      fmtDay.format(wStart) + ' — ' + fmtDay.format(wEnd) + ' · потрачено ' + zl(weekSpent);

    var pct = weekAvailable > 0 ? Math.min(weekSpent / weekAvailable, 1) : 1;
    var bar = document.getElementById('weekBar');
    bar.style.width = (pct * 100) + '%';
    bar.className = pct < 0.6 ? 'ok' : (pct < 0.9 ? 'warn' : 'bad');

    renderActivity(curItems, wStart, wEnd, weekAvailable, t);
    applyPalette(TOTAL > 0 ? left / TOTAL : 0);

    renderHistory(allItems, currentKey);
  }

  // --- История: аккордеон по месячным периодам ---
  function groupByPeriod(items) {
    var map = {};
    items.forEach(function (it) {
      var key = periodKeyFor(dateOnly(it.ts));
      if (!map[key]) map[key] = [];
      map[key].push(it);
    });
    return map;
  }

  function renderHistory(allItems, currentKey) {
    var list = document.getElementById('list');
    list.innerHTML = '';
    if (!allItems.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Пока нет трат — добавьте первую выше';
      list.appendChild(e);
      return;
    }

    var groups = groupByPeriod(allItems);
    if (!groups[currentKey]) groups[currentKey] = [];
    var keys = Object.keys(groups).sort().reverse(); // "YYYY-MM" сортируется хронологически

    keys.forEach(function (key) {
      var itemsForPeriod = groups[key].slice().sort(function (a, b) { return b.ts - a.ts; });
      var isCurrent = key === currentKey;
      var groupSpent = itemsForPeriod.reduce(function (s, it) { return s + it.amount; }, 0);
      var expanded = isExpanded(key, isCurrent);

      var group = document.createElement('div');
      group.className = 'period-group' + (isCurrent ? ' is-current' : '');

      var header = document.createElement('button');
      header.type = 'button';
      header.className = 'period-header';
      header.setAttribute('aria-expanded', expanded ? 'true' : 'false');

      var headLeft = document.createElement('div');
      headLeft.className = 'period-head-left';
      if (isCurrent) {
        var headEyebrow = document.createElement('div');
        headEyebrow.className = 'period-eyebrow';
        headEyebrow.textContent = 'Текущий период';
        headLeft.appendChild(headEyebrow);
      }
      var headTitle = document.createElement('div');
      headTitle.className = 'period-title';
      headTitle.textContent = periodMonthLabel(key);
      var headSub = document.createElement('div');
      headSub.className = 'period-sub';
      var count = itemsForPeriod.length;
      headSub.textContent = periodLabel(key) + ' · ' + count + (count === 1 ? ' трата' : (count >= 2 && count <= 4 ? ' траты' : ' трат')) + ' · ' + zl(groupSpent);
      headLeft.appendChild(headTitle);
      headLeft.appendChild(headSub);

      var chevron = document.createElement('div');
      chevron.className = 'period-chevron';
      chevron.textContent = expanded ? '▾' : '▸';

      header.appendChild(headLeft);
      header.appendChild(chevron);
      header.addEventListener('click', function () {
        collapsedPeriods[key] = expanded; // если сейчас развёрнуто — сворачиваем, и наоборот
        render();
      });

      var body = document.createElement('div');
      body.className = 'period-body';
      body.hidden = !expanded;

      if (!itemsForPeriod.length) {
        var pe = document.createElement('div');
        pe.className = 'empty';
        pe.textContent = 'Нет трат в этом периоде';
        body.appendChild(pe);
      } else {
        itemsForPeriod.forEach(function (it) { renderEntry(body, it); });
      }

      group.appendChild(header);
      group.appendChild(body);
      list.appendChild(group);
    });
  }

  function renderEntry(container, it) {
    var row = document.createElement('div');
    row.className = 'entry';

    if (editingId === it.id) {
      row.className = 'entry editing';

      var fields = document.createElement('div');
      fields.className = 'edit-fields';
      var dateInput = document.createElement('input');
      dateInput.className = 'e-date';
      dateInput.type = 'date';
      dateInput.max = todayInputValue();
      dateInput.value = dateInputValue(it.ts);
      dateInput.setAttribute('aria-label', 'Дата траты');
      var amtInput = document.createElement('input');
      amtInput.className = 'e-amt';
      amtInput.type = 'text';
      amtInput.setAttribute('inputmode', 'decimal');
      amtInput.value = String(it.amount).replace('.', ',');
      amtInput.setAttribute('aria-label', 'Сумма');
      var noteInput = document.createElement('input');
      noteInput.className = 'e-note';
      noteInput.type = 'text';
      noteInput.maxLength = 80;
      noteInput.placeholder = 'Заметка (необязательно)';
      noteInput.value = it.note || '';
      noteInput.setAttribute('aria-label', 'Заметка');
      fields.appendChild(dateInput);
      fields.appendChild(amtInput);
      fields.appendChild(noteInput);

      // Фото в режиме редактирования
      var photoRow = document.createElement('div');
      photoRow.className = 'edit-photo';
      var pendingBlob = null;      // новый выбранный файл
      var removePhoto = false;     // пометка на удаление
      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.hidden = true;

      var previewWrap = document.createElement('div');
      previewWrap.className = 'photo-preview';
      previewWrap.hidden = true;
      var previewImg = document.createElement('img');
      previewImg.alt = 'Фото';
      var previewRm = document.createElement('button');
      previewRm.type = 'button';
      previewRm.className = 'rm';
      previewRm.textContent = '✕';
      previewRm.setAttribute('aria-label', 'Убрать фото');
      previewWrap.appendChild(previewImg);
      previewWrap.appendChild(previewRm);

      var photoBtn = document.createElement('button');
      photoBtn.type = 'button';
      photoBtn.className = 'photo-btn';

      function refreshPhotoBtn() {
        photoBtn.textContent = (previewWrap.hidden ? '📷 Добавить фото' : '📷 Заменить фото');
      }
      function showPreviewFromBlob(blob) {
        var u = URL.createObjectURL(blob);
        objectUrls.push(u);
        previewImg.src = u;
        previewWrap.hidden = false;
        refreshPhotoBtn();
      }
      // показать существующее фото, если есть
      if (it.hasPhoto) {
        getPhoto(it.id).then(function (blob) {
          if (blob && !removePhoto && !pendingBlob) showPreviewFromBlob(blob);
        });
      }
      photoBtn.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        compress(f).then(function (blob) {
          pendingBlob = blob;
          removePhoto = false;
          showPreviewFromBlob(blob);
        }).catch(function () { alert('Не удалось обработать фото'); });
      });
      previewRm.addEventListener('click', function () {
        pendingBlob = null;
        removePhoto = true;
        previewImg.removeAttribute('src');
        previewWrap.hidden = true;
        fileInput.value = '';
        refreshPhotoBtn();
      });
      refreshPhotoBtn();
      photoRow.appendChild(photoBtn);
      photoRow.appendChild(previewWrap);
      photoRow.appendChild(fileInput);

      var actions = document.createElement('div');
      actions.className = 'edit-actions';
      var saveBtn = document.createElement('button');
      saveBtn.className = 'esave';
      saveBtn.type = 'button';
      saveBtn.textContent = 'Сохранить';
      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'ecancel';
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Отмена';
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);

      function commitEdit() {
        var v = parseFloat(amtInput.value.replace(',', '.'));
        if (!isFinite(v) || v <= 0) { amtInput.focus(); return; }
        var patch = {
          amount: Math.round(v * 100) / 100,
          note: noteInput.value.trim(),
          ts: dateInput.value ? combineDateKeepTime(dateInput.value, it.ts) : it.ts
        };

        var photoOp = Promise.resolve();
        if (pendingBlob) {
          photoOp = putPhoto(it.id, pendingBlob);
          patch.hasPhoto = true;
        } else if (removePhoto) {
          photoOp = delPhoto(it.id);
          patch.hasPhoto = false;
        }
        photoOp.then(function () {
          return updateDoc(doc(db, 'expenses', it.id), patch);
        }).then(function () {
          editingId = null;
          render();
        });
      }
      saveBtn.addEventListener('click', commitEdit);
      dateInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitEdit(); });
      amtInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitEdit(); });
      noteInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitEdit(); });
      cancelBtn.addEventListener('click', function () { editingId = null; render(); });

      row.appendChild(fields);
      row.appendChild(photoRow);
      row.appendChild(actions);
      container.appendChild(row);
      return;
    }

    if (it.hasPhoto) {
      var thumb = document.createElement('img');
      thumb.className = 'thumb';
      thumb.alt = 'Фото траты';
      (function (id) {
        getPhoto(id).then(function (blob) {
          if (blob) { var u = URL.createObjectURL(blob); objectUrls.push(u); thumb.src = u; }
        });
      })(it.id);
      thumb.addEventListener('click', function () { openModal(it.id); });
      row.appendChild(thumb);
    }

    var info = document.createElement('div');
    info.className = 'info';
    var amt = document.createElement('div');
    amt.className = 'amt';
    amt.textContent = zl(it.amount);
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = fmtFull.format(new Date(it.ts)) + (it.note ? ' · ' + it.note : '');
    info.appendChild(amt);
    info.appendChild(meta);

    var acts = document.createElement('div');
    acts.className = 'actions';
    var edit = document.createElement('button');
    edit.className = 'iconbtn edit';
    edit.type = 'button';
    edit.textContent = '✎';
    edit.setAttribute('aria-label', 'Редактировать трату ' + zl(it.amount));
    edit.addEventListener('click', function () {
      editingId = it.id;
      render();
    });
    var del = document.createElement('button');
    del.className = 'iconbtn del';
    del.type = 'button';
    del.textContent = '✕';
    del.setAttribute('aria-label', 'Удалить трату ' + zl(it.amount));
    del.addEventListener('click', function () {
      delPhoto(it.id);
      deleteDoc(doc(db, 'expenses', it.id));
    });
    acts.appendChild(edit);
    acts.appendChild(del);

    row.appendChild(info);
    row.appendChild(acts);
    container.appendChild(row);
  }

  // --- Прикрепление фото в форме добавления ---
  var addPendingBlob = null;
  document.getElementById('addPhotoBtn').addEventListener('click', function () {
    document.getElementById('addPhotoInput').click();
  });
  document.getElementById('addPhotoInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    compress(f).then(function (blob) {
      addPendingBlob = blob;
      var u = URL.createObjectURL(blob);
      var img = document.getElementById('addPhotoImg');
      img.onload = function () { URL.revokeObjectURL(u); };
      img.src = u;
      document.getElementById('addPhotoPreview').hidden = false;

  });
  function clearAddPhoto() {

    document.getElementById('addPhotoPreview').hidden = true;
  }
  document.getElementById('addPhotoRemove').addEventListener('click', clearAddPhoto);

  var dateEl = document.getElementById('entryDate');
  dateEl.max = todayInputValue();
  dateEl.value = todayInputValue();

  document.getElementById('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var amountEl = document.getElementById('amount');
    var noteEl = document.getElementById('note');
    var amount = parseFloat(amountEl.value.replace(',', '.'));
    if (!isFinite(amount) || amount <= 0) { amountEl.focus(); return; }
    var id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    var ts = dateEl.value ? combineDateKeepTime(dateEl.value, Date.now()) : Date.now();
    var entry = {
      amount: Math.round(amount * 100) / 100,
      note: noteEl.value.trim(),
      ts: ts,
      hasPhoto: !!addPendingBlob
    };
    var photoOp = addPendingBlob ? putPhoto(id, addPendingBlob) : Promise.resolve();
    photoOp.then(function () {
      return setDoc(doc(db, 'expenses', id), entry);
    }).then(function () {
      amountEl.value = '';
      noteEl.value = '';
      clearAddPhoto();
      closeSheet();
    });

  document.getElementById('modalClose').addEventListener('click', closeModal);

    if (e.target === this) closeModal();
  });

  // --- Редактирование бюджета текущего месячного периода ---
  // Поле редактирует не абстрактный "общий бюджет", а сам ОСТАТОК: вводишь,
  // сколько должно остаться до конца периода, и приложение само пересчитывает
  // общий бюджет как (уже потрачено в этом периоде + введённый остаток).
  function openBudgetEdit() {
    var inp = document.getElementById('budgetInput');
    inp.value = '';
    inp.placeholder = 'сейчас ' + zl(TOTAL - currentSpent());
    document.getElementById('budgetEdit').hidden = false;
    document.getElementById('budgetBtn').hidden = true;
    inp.focus();
  }
  function commitBudget() {
    var inp = document.getElementById('budgetInput');
    var raw = inp.value.trim();
    if (raw) {
      var v = parseFloat(raw.replace(',', '.'));
      if (isFinite(v) && v >= 0) {
        var newTotal = currentSpent() + v;
        if (newTotal > 0) {
          TOTAL = Math.round(newTotal * 100) / 100;
          budgetsCache[currentPeriodKey()] = TOTAL;
          setDoc(doc(db, 'budgets', currentPeriodKey()), { total: TOTAL });
        }
      }
    }
    document.getElementById('budgetEdit').hidden = true;
    document.getElementById('budgetBtn').hidden = false;
    render();
  }
  document.getElementById('budgetBtn').addEventListener('click', openBudgetEdit);
  document.getElementById('budgetInput').addEventListener('blur', commitBudget);
  document.getElementById('budgetInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitBudget(); }
    else if (e.key === 'Escape') {
      e.preventDefault();
      document.getElementById('budgetInput').value = '';
      document.getElementById('budgetInput').blur();
    }
  });

  document.getElementById('addBtn').addEventListener('click', openSheet);
  document.getElementById('overlay').addEventListener('click', closeSheet);
  document.getElementById('historyBtn').addEventListener('click', function () {
    document.getElementById('historySection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  onSnapshot(expensesCol, function (snapshot) {
    itemsCache = snapshot.docs.map(function (d) {
      var data = d.data();
      data.id = d.id;
      return data;
    });
    render();
  });

  onSnapshot(budgetsCol, function (snapshot) {
    budgetsCache = {};
    snapshot.docs.forEach(function (d) {
      var data = d.data();
      if (data && isFinite(data.total) && data.total > 0) budgetsCache[d.id] = data.total;
    });
    render();
  });

  render();
</script>
</body>
</html>
