<title>Бюджет на продукты</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #FAFAF8;
    --card: #FFFFFF;
    --ink: #1A1D1C;
    --muted: #6E7573;
    --line: #E7EAE6;
    --green: #1E7A4C;
    --green-soft: #E4F1EA;
    --orange: #D97706;
    --red: #DC2626;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    text-transform: lowercase;
    color: var(--muted);
  }

  .hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 18px 18px;
  }
  .hero .big {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    margin: 6px 0 2px;
  }
  .hero .big.over { color: var(--red); }
  .hero .sub { color: var(--muted); font-size: 15px; }
  .hero .stats {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .stat { flex: 1; }
  .stat .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 13px; color: var(--muted); margin-top: 1px; }

  .big-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 2px; }
  .big-row .big { margin: 0; }
  .edit-icon {
    font: inherit;
    font-size: 18px;
    color: var(--muted);
    background: none;
    border: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .edit-icon:active { background: var(--line); color: var(--ink); }
  .budget-edit { margin-top: 12px; }
  .budget-edit .txt {
    width: 100%;
    font: inherit;
    font-size: 22px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--ink);
    min-height: 52px;
  }
  .budget-edit .txt:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }

  .week {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .week .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .week .left-amt { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .week .left-amt.over { color: var(--red); }
  .week .of { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar {
    height: 10px;
    border-radius: 5px;
    background: var(--line);
    margin-top: 12px;
    overflow: hidden;
  }
  .bar > div { height: 100%; border-radius: 5px; width: 0; transition: width .3s ease; }
  .bar .ok { background: var(--green); }
  .bar .warn { background: var(--orange); }
  .bar .bad { background: var(--red); }
  .week .range { font-size: 13px; color: var(--muted); margin-top: 8px; }

  form.add {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .add input.txt {
    width: 100%;
    font: inherit;
    font-size: 17px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--ink);
    min-height: 52px;
  }
  .add input.txt:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }
  .add input#amount { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .photo-attach {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
  }
  .photo-btn {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    min-height: 52px;
    cursor: pointer;
  }
  .photo-btn:active { opacity: .85; }
  .photo-preview { position: relative; flex-shrink: 0; }
  .photo-preview img { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; display: block; border: 1px solid var(--line); }
  .photo-preview .rm {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    border: 2px solid var(--card);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add button.submit {
    font: inherit;
    font-size: 17px;
    font-weight: 650;
    min-height: 52px;
    border: 0;
    border-radius: 12px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  .add button.submit:active { opacity: .85; }

  .history { display: flex; flex-direction: column; gap: 0; }
  .history .eyebrow { margin: 6px 4px 8px; }
  .entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 8px 12px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .entry .thumb {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 9px;
    object-fit: cover;
    background: var(--line);
    border: 0;
    padding: 0;
    cursor: pointer;
    display: block;
  }
  .entry .info { flex: 1; min-width: 0; }
  .entry .amt { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .entry .meta { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .actions { display: flex; flex-shrink: 0; }
  .entry .iconbtn {
    font: inherit;
    font-size: 17px;
    color: var(--muted);
    background: none;
    border: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .entry .edit:active { background: var(--line); color: var(--ink); }
  .entry .del:active { background: var(--line); color: var(--red); }
  .empty { color: var(--muted); font-size: 15px; text-align: center; padding: 18px 0 6px; }

  .entry.editing { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 14px; }
  .entry .edit-fields { display: flex; flex-direction: column; gap: 8px; }
  .entry .edit-fields input {
    width: 100%;
    font: inherit;
    font-size: 17px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    min-height: 48px;
  }
  .entry .edit-fields input:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: transparent; }
  .entry .edit-fields input.e-amt { font-weight: 650; font-variant-numeric: tabular-nums; }
  .entry .edit-photo { display: flex; align-items: center; gap: 10px; }
  .entry .edit-actions { display: flex; gap: 8px; }
  .entry .edit-actions button {
    font: inherit;
    font-size: 16px;
    font-weight: 650;
    min-height: 48px;
    flex: 1;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  .entry .edit-actions .esave { background: var(--ink); color: #fff; }
  .entry .edit-actions .ecancel { background: var(--line); color: var(--ink); }
  .entry .edit-actions button:active { opacity: .85; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal[hidden] { display: none; }
  .modal img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .modal .close {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 0;
    font-size: 22px;
    cursor: pointer;
  }
</style>

<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Осталось до 22 августа</div>
    <div class="big-row">
      <div class="big" id="totalLeft">—</div>
      <button type="button" class="edit-icon" id="budgetBtn" aria-label="Изменить бюджет">✎</button>
    </div>
    <div class="sub" id="totalSub"></div>
    <div class="budget-edit" id="budgetEdit" hidden>
      <input class="txt" id="budgetInput" type="text" inputmode="decimal" placeholder="Общий бюджет, zł" aria-label="Общий бюджет, zł">
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="daysLeft">—</div><div class="l">дней осталось</div></div>
      <div class="stat"><div class="v" id="perDay">—</div><div class="l">в день в среднем</div></div>
    </div>
  </section>

  <section class="week">
    <div class="eyebrow" id="weekTitle">Эта неделя</div>
    <div class="row" style="margin-top:6px">
      <div class="left-amt" id="weekLeft">—</div>
      <div class="of">из 155 zł</div>
    </div>
    <div class="bar"><div id="weekBar" class="ok"></div></div>
    <div class="range" id="weekRange"></div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <input class="txt" id="amount" type="text" inputmode="decimal" placeholder="Сумма, zł" aria-label="Сумма в злотых">
    <input class="txt" id="note" type="text" placeholder="Заметка (необязательно)" aria-label="Заметка" maxlength="80">
    <div class="photo-attach">
      <button type="button" class="photo-btn" id="addPhotoBtn">📷 Добавить фото</button>
      <div class="photo-preview" id="addPhotoPreview" hidden>
        <img id="addPhotoImg" alt="Предпросмотр фото">
        <button type="button" class="rm" id="addPhotoRemove" aria-label="Убрать фото">✕</button>
      </div>
    </div>
    <input type="file" id="addPhotoInput" accept="image/*" hidden>
    <button type="submit" class="submit">Добавить</button>
  </form>

  <section class="history">
    <div class="eyebrow">История</div>
    <div id="list"></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <button type="button" class="close" id="modalClose" aria-label="Закрыть">✕</button>
  <img id="modalImg" alt="Фото траты">
</div>

<script>
  var DEFAULT_TOTAL = 664;
  var WEEK_BUDGET = 155;
  var START = new Date(2026, 6, 27);  // 27 июля 2026
  var END = new Date(2026, 7, 22);    // 22 августа 2026 включительно
  var DAY = 86400000;
  var KEY = 'grocery-budget-664';
  var BKEY = 'grocery-budget-total';

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save(items) { localStorage.setItem(KEY, JSON.stringify(items)); }

  function loadTotal() {
    var v = parseFloat(localStorage.getItem(BKEY));
    return (isFinite(v) && v > 0) ? v : DEFAULT_TOTAL;
  }
  function saveTotal(v) { localStorage.setItem(BKEY, String(v)); }
  var TOTAL = loadTotal();

  // --- Фото: хранилище в IndexedDB ---
  var DB_NAME = 'grocery-budget-db';
  var STORE = 'photos';
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function putPhoto(id, blob) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function getPhoto(id) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readonly');
        var rq = tx.objectStore(STORE).get(id);
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function delPhoto(id) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    }).catch(function () {});
  }

  // Сжатие фото до разумного размера (макс. сторона 1200px, JPEG)
  function compress(file) {
    return new Promise(function (res, rej) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var max = 1200;
        var w = img.width, h = img.height;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.72);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }

  function zl(n) {
    var s = (Math.round(n * 100) / 100).toFixed(2).replace('.', ',').replace(/,00$/, '');
    return s + ' zł';
  }
  function today0() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  var fmtDay = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'short' });
  var fmtFull = new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  var editingId = null;
  var objectUrls = [];
  function freeUrls() {
    objectUrls.forEach(function (u) { URL.revokeObjectURL(u); });
    objectUrls = [];
  }

  function openModal(id) {
    getPhoto(id).then(function (blob) {
      if (!blob) return;
      var u = URL.createObjectURL(blob);
      var modal = document.getElementById('modal');
      var mimg = document.getElementById('modalImg');
      mimg.onload = function () { URL.revokeObjectURL(u); };
      mimg.src = u;
      modal.hidden = false;
    });
  }
  function closeModal() {
    var modal = document.getElementById('modal');
    modal.hidden = true;
    document.getElementById('modalImg').removeAttribute('src');
  }

  function render() {
    freeUrls();
    TOTAL = loadTotal();
    var items = load();
    var spent = items.reduce(function (s, it) { return s + it.amount; }, 0);
    var left = TOTAL - spent;

    var t = today0();
    var ended = t > END;
    var days = ended ? 0 : Math.round((END - Math.max(t, START)) / DAY) + 1;

    var elTotal = document.getElementById('totalLeft');
    elTotal.textContent = zl(left);
    elTotal.classList.toggle('over', left < 0);
    document.getElementById('totalSub').textContent =
      'потрачено ' + zl(spent) + ' из ' + TOTAL + ' zł';
    document.getElementById('daysLeft').textContent = days;
    document.getElementById('perDay').textContent =
      days > 0 ? zl(Math.max(left, 0) / days) : '—';

    // Неделя: блоки по 7 дней от 27 июля
    var idx = Math.min(Math.max(Math.floor((t - START) / DAY / 7), 0), 3);
    var wStart = new Date(START.getTime() + idx * 7 * DAY);
    var wEnd = new Date(Math.min(wStart.getTime() + 6 * DAY, END.getTime()));
    var weekSpent = items.reduce(function (s, it) {
      var d = new Date(it.ts);
      var d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return (d0 >= wStart && d0 <= wEnd) ? s + it.amount : s;
    }, 0);
    var weekLeft = WEEK_BUDGET - weekSpent;

    document.getElementById('weekTitle').textContent = ended ? 'Период завершён' : 'Неделя ' + (idx + 1) + ' из 4';
    var elWeekLeft = document.getElementById('weekLeft');
    elWeekLeft.textContent = zl(weekLeft);
    elWeekLeft.classList.toggle('over', weekLeft < 0);
    document.getElementById('weekRange').textContent =
      fmtDay.format(wStart) + ' — ' + fmtDay.format(wEnd) + ' · потрачено ' + zl(weekSpent);

    var pct = Math.min(weekSpent / WEEK_BUDGET, 1);
    var bar = document.getElementById('weekBar');
    bar.style.width = (pct * 100) + '%';
    bar.className = pct < 0.6 ? 'ok' : (pct < 0.9 ? 'warn' : 'bad');

    // История
    var list = document.getElementById('list');
    list.innerHTML = '';
    if (!items.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Пока нет трат — добавьте первую выше';
      list.appendChild(e);
      return;
    }
    items.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (it) {
      var row = document.createElement('div');
      row.className = 'entry';

      if (editingId === it.id) {
        row.className = 'entry editing';

        var fields = document.createElement('div');
        fields.className = 'edit-fields';
        var amtInput = document.createElement('input');
        amtInput.className = 'e-amt';
        amtInput.type = 'text';
        amtInput.setAttribute('inputmode', 'decimal');
        amtInput.value = String(it.amount).replace('.', ',');
        amtInput.setAttribute('aria-label', 'Сумма');
        var noteInput = document.createElement('input');
        noteInput.className = 'e-note';
        noteInput.type = 'text';
        noteInput.maxLength = 80;
        noteInput.placeholder = 'Заметка (необязательно)';
        noteInput.value = it.note || '';
        noteInput.setAttribute('aria-label', 'Заметка');
        fields.appendChild(amtInput);
        fields.appendChild(noteInput);

        // Фото в режиме редактирования
        var photoRow = document.createElement('div');
        photoRow.className = 'edit-photo';
        var pendingBlob = null;      // новый выбранный файл
        var removePhoto = false;     // пометка на удаление
        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.hidden = true;

        var previewWrap = document.createElement('div');
        previewWrap.className = 'photo-preview';
        previewWrap.hidden = true;
        var previewImg = document.createElement('img');
        previewImg.alt = 'Фото';
        var previewRm = document.createElement('button');
        previewRm.type = 'button';
        previewRm.className = 'rm';
        previewRm.textContent = '✕';
        previewRm.setAttribute('aria-label', 'Убрать фото');
        previewWrap.appendChild(previewImg);
        previewWrap.appendChild(previewRm);

        var photoBtn = document.createElement('button');
        photoBtn.type = 'button';
        photoBtn.className = 'photo-btn';

        function refreshPhotoBtn() {
          photoBtn.textContent = (previewWrap.hidden ? '📷 Добавить фото' : '📷 Заменить фото');
        }
        function showPreviewFromBlob(blob) {
          var u = URL.createObjectURL(blob);
          objectUrls.push(u);
          previewImg.src = u;
          previewWrap.hidden = false;
          refreshPhotoBtn();
        }
        // показать существующее фото, если есть
        if (it.hasPhoto) {
          getPhoto(it.id).then(function (blob) {
            if (blob && !removePhoto && !pendingBlob) showPreviewFromBlob(blob);
          });
        }
        photoBtn.addEventListener('click', function () { fileInput.click(); });
        fileInput.addEventListener('change', function () {
          var f = fileInput.files && fileInput.files[0];
          if (!f) return;
          compress(f).then(function (blob) {
            pendingBlob = blob;
            removePhoto = false;
            showPreviewFromBlob(blob);
          }).catch(function () { alert('Не удалось обработать фото'); });
        });
        previewRm.addEventListener('click', function () {
          pendingBlob = null;
          removePhoto = true;
          previewImg.removeAttribute('src');
          previewWrap.hidden = true;
          fileInput.value = '';
          refreshPhotoBtn();
        });
        refreshPhotoBtn();
        photoRow.appendChild(photoBtn);
        photoRow.appendChild(previewWrap);
        photoRow.appendChild(fileInput);

        var actions = document.createElement('div');
        actions.className = 'edit-actions';
        var saveBtn = document.createElement('button');
        saveBtn.className = 'esave';
        saveBtn.type = 'button';
        saveBtn.textContent = 'Сохранить';
        var cancelBtn = document.createElement('button');
        cancelBtn.className = 'ecancel';
        cancelBtn.type = 'button';
        cancelBtn.textContent = 'Отмена';
        actions.appendChild(saveBtn);
        actions.appendChild(cancelBtn);

        function commitEdit() {
          var v = parseFloat(amtInput.value.replace(',', '.'));
          if (!isFinite(v) || v <= 0) { amtInput.focus(); return; }
          var all = load();
          var target = null;
          for (var i = 0; i < all.length; i++) {
            if (all[i].id === it.id) { target = all[i]; break; }
          }
          if (!target) { editingId = null; render(); return; }
          target.amount = Math.round(v * 100) / 100;
          target.note = noteInput.value.trim();

          var photoOp = Promise.resolve();
          if (pendingBlob) {
            photoOp = putPhoto(it.id, pendingBlob);
            target.hasPhoto = true;
          } else if (removePhoto) {
            photoOp = delPhoto(it.id);
            target.hasPhoto = false;
          }
          photoOp.then(function () {
            save(all);
            editingId = null;
            render();
          });
        }
        saveBtn.addEventListener('click', commitEdit);
        amtInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitEdit(); });
        noteInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitEdit(); });
        cancelBtn.addEventListener('click', function () { editingId = null; render(); });

        row.appendChild(fields);
        row.appendChild(photoRow);
        row.appendChild(actions);
        list.appendChild(row);
        return;
      }

      if (it.hasPhoto) {
        var thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.alt = 'Фото траты';
        (function (id) {
          getPhoto(id).then(function (blob) {
            if (blob) { var u = URL.createObjectURL(blob); objectUrls.push(u); thumb.src = u; }
          });
        })(it.id);
        thumb.addEventListener('click', function () { openModal(it.id); });
        row.appendChild(thumb);
      }

      var info = document.createElement('div');
      info.className = 'info';
      var amt = document.createElement('div');
      amt.className = 'amt';
      amt.textContent = zl(it.amount);
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = fmtFull.format(new Date(it.ts)) + (it.note ? ' · ' + it.note : '');
      info.appendChild(amt);
      info.appendChild(meta);

      var acts = document.createElement('div');
      acts.className = 'actions';
      var edit = document.createElement('button');
      edit.className = 'iconbtn edit';
      edit.type = 'button';
      edit.textContent = '✎';
      edit.setAttribute('aria-label', 'Редактировать трату ' + zl(it.amount));
      edit.addEventListener('click', function () {
        editingId = it.id;
        render();
      });
      var del = document.createElement('button');
      del.className = 'iconbtn del';
      del.type = 'button';
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Удалить трату ' + zl(it.amount));
      del.addEventListener('click', function () {
        delPhoto(it.id);
        save(load().filter(function (x) { return x.id !== it.id; }));
        render();
      });
      acts.appendChild(edit);
      acts.appendChild(del);

      row.appendChild(info);
      row.appendChild(acts);
      list.appendChild(row);
    });
  }

  // --- Прикрепление фото в форме добавления ---
  var addPendingBlob = null;
  document.getElementById('addPhotoBtn').addEventListener('click', function () {
    document.getElementById('addPhotoInput').click();
  });
  document.getElementById('addPhotoInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    compress(f).then(function (blob) {
      addPendingBlob = blob;
      var u = URL.createObjectURL(blob);
      var img = document.getElementById('addPhotoImg');
      img.onload = function () { URL.revokeObjectURL(u); };
      img.src = u;
      document.getElementById('addPhotoPreview').hidden = false;
    }).catch(function () { alert('Не удалось обработать фото'); });
  });
  function clearAddPhoto() {
    addPendingBlob = null;
    document.getElementById('addPhotoInput').value = '';
    document.getElementById('addPhotoImg').removeAttribute('src');
    document.getElementById('addPhotoPreview').hidden = true;
  }
  document.getElementById('addPhotoRemove').addEventListener('click', clearAddPhoto);

  document.getElementById('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var amountEl = document.getElementById('amount');
    var noteEl = document.getElementById('note');
    var amount = parseFloat(amountEl.value.replace(',', '.'));
    if (!isFinite(amount) || amount <= 0) { amountEl.focus(); return; }
    var id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    var items = load();
    var entry = {
      id: id,
      amount: Math.round(amount * 100) / 100,
      note: noteEl.value.trim(),
      ts: Date.now(),
      hasPhoto: !!addPendingBlob
    };
    var photoOp = addPendingBlob ? putPhoto(id, addPendingBlob) : Promise.resolve();
    photoOp.then(function () {
      items.push(entry);
      save(items);
      amountEl.value = '';
      noteEl.value = '';
      clearAddPhoto();
      amountEl.focus();
      render();
    });
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  // --- Редактирование общего бюджета (инлайн, без кнопок) ---
  var budgetEditing = false;
  function openBudgetEdit() {
    var inp = document.getElementById('budgetInput');
    inp.value = String(loadTotal()).replace('.', ',');
    document.getElementById('budgetEdit').hidden = false;
    document.getElementById('budgetBtn').hidden = true;
    budgetEditing = true;
    inp.focus();
    inp.select();
  }
  function commitBudget() {
    if (!budgetEditing) return;
    budgetEditing = false;
    var inp = document.getElementById('budgetInput');
    var v = parseFloat(inp.value.replace(',', '.'));
    if (isFinite(v) && v > 0) saveTotal(Math.round(v * 100) / 100);
    document.getElementById('budgetEdit').hidden = true;
    document.getElementById('budgetBtn').hidden = false;
    render();
  }
  document.getElementById('budgetBtn').addEventListener('click', openBudgetEdit);
  document.getElementById('budgetInput').addEventListener('blur', commitBudget);
  document.getElementById('budgetInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
    else if (e.key === 'Escape') {
      budgetEditing = false;
      document.getElementById('budgetEdit').hidden = true;
      document.getElementById('budgetBtn').hidden = false;
    }
  });

  render();
</script>
